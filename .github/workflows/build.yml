      - name: Recepten bundelen
        run: |
          ls content/recipes/*.json >/dev/null 2>&1 || { echo "GEEN receptbestanden"; exit 1; }
          for f in content/recipes/*.json; do jq -S 'del(.slug)' "$f"; done | jq -s '.' > recipes.json
