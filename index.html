 st Knoflook",      "- 2 st Witte bonen in tomatensaus grote pot",      "- 1 st Bouillonblokje runder",      "- 1 st Stokbrood",      "- 1/2 l Water"    ],    "s": [      "",      "",      "  - Peper",      "  - Soepstengels",      "  - Kruidenboter",      "",      "Ui snipperen, en fruiten met chilipoeder. Knoflook erbij persen. Bonen met saus en 0,5 l water toevoegen met verkruimeld bouillonblokje. 10 minuten zachtjes laten koken. Broccoli in kleine roosjes snijden en beetgaar koken (5 min). Spekjes uitbakken in koekenpan met de peper.",      "",      "Bonenmengsel pureren met staafmixer, en broccoli toevoegen. Aanvullen tot 3,4 liter soep. Soep in de borden scheppen en spekjes erin strooien. Eventueel serveren met (stok-)brood.",      "",      "Kruidenboter kun je ook zelf maken met 50 gram boter en 3/4 tl kruidenboterpoeder.",      ""    ]  },  {    "t": "Wortel rauwkost",    "p": 23,    "i": [      "- 500 g Wortels",      "- 75 g Rozijnen",      "- 1 dl Appelsap",      "- 1 el Citroen sap",      "- 1 tl Mosterd",      "- 1/2 tl Ketoembar"    ],    "s": [      "",      "  - Peper",      "  - Zout",      "",      "Wortelsalade;",      "",      "1. Was de rozijnen en week ze ½ uur in het appelsap met citroensap.",      "2. Giet de rozijnen in een zeef en vang het vocht op.",      "3. Maak van het vocht met de mosterd, peper en zout een dressing.",      "4. Schrap de wortelen en rasp ze grof. Meng alles door elkaar.",      ""    ]  },  {    "t": "Wraps Annemieke",    "p": 23,    "i": [      "- 200 g Gehakt, half-om-half vegetarisch!",      "- 24 st Wraptortilla 3x8 medium",      "- 1 st Mais",      "- 1 st Gepelde Tomaten 4 ons",      "- 1 st Kidney Bonen",      "- 1 st Sla grote ijsbergsla",      "- 125 ml Crème Fraîche",      "- 1 st Ui",      "- 1 st Knoflook",      "- 300 g Geraspte Kaas"    ],    "s": [      "",      "  - Peper",      "  - Olie Olijf",      "",      "Fruit gesnipperde ui en teentje knoflook 3 minuten in olie. Bal de gehakt erin rul. Voeg tomaat, mais, bonen en de peper toe en kook alles 5 minuten. Was de sla en leg de losse bladeren in een schaal. Maak de saus af met de crème fraîche. Bereid de wraps zoals aangegeven op de verpakking. Wraps, saus, sla en kaas apart serveren.",      "",      ""    ]  },  {    "t": "Zoet-zure rijst met ananas",    "p": 24,    "i": [      "|  3 | st | Paprika | stoplicht  |",      "|  1/2 | l | Ananas | dubbel blik  |",      "|  2 | el | Ananas | vocht  |",      "|  1 | st | Ui |   |",      "|  2 | el | Azijn |   |",      "|  1 | el | Ketjap Manis |   |",      "|  1 | el | Suiker | Bruine basterd  |",      "|  200 | g | Rijst |   |",      "|  1 | tl | Maizena |   |"    ],    "s": [      "",      "",      "Kook de rijst volgens gebruiksaanwijzing. De ui snipperen. Laat de ananas uitlekken en meng het vocht de azijn, de ketjap, de bruine suiker, de maizena en een mespuntje zout. Fruit de ui en paprika. Dan het zoetzure mengsel erbij doen en op hoog vuur en 2 minuten laten droogkomen. Vervolgens de ananasstukjes toevoegen en alles laten doorwarmen.",      ""    ]  },  {    "t": "Zuurkool ovenschotel Mien",    "p": 24,    "i": [      "|  200 | g | Gehakt, half-om-half |   |",      "|  125 | g | Spekreepjes | reepjes  |",      "|  300 | g | Zuurkool |   |",      "|  800 | g | Aardappels |   |",      "|  1 1/2 | st | Ui | gesnipperd  |",      "|   | - | Boter |   |",      "|   | - | Zout |   |",      "|   | - | Peper |   |",      "|   | - | Nootmuskaat |   |",      "|   | - | Kerriepoeder |   |",      "|   | - | Paneermeel |   |",      "|   | - | Melk |   |",      "|  4 | st | Kruidnagels |   |",      "|  2 | st | Laurierblaadjes |   |"    ],    "s": [      "",      "",      "Zuurkool 30 min stoven met 1/2 ui, 4 kruidnagels en 2 laurier bladen en een hand krenten (50 gram).",      "",      "Kook de aardappelen 20 min gaar en maak er een puree van met een klontje boter, wat zout, peper, nootmuskaat, kerrie en een scheutje melk.",      "",      "Verwarm de oven voor op 200 °C",      "",      "Bak de spekjes uit en bewaar ze.",      "",      "Fruit de ui en bak het gehakt erbij rul (voeg eventueel wat vleeskruiden toe).",      "",      "Vet de ovenschaal in en verdeel eerst de zuurkool, dan het vlees, en dan de aardappelpuree in de schaal. Bestrooien met paneermeel en 5 kleine stukjes boter erop leggen.",      "",      "Zet de schaal 30 min in de oven op 200°C.",      ""    ]  },  {    "t": "Zuurkool stamppot",    "p": 24,    "i": [      "|  250 | g | Spekjes, gerookt  |",      "|  500 | g | Zuurkool  |",      "|  1000 | g | Aardappels  |",      "|  70 | g | Rozijnen  |",      "|  1/2 | l | Perzik uit blik  |",      "|  1 | st | Ui  |",      "|   | - | Mosterd  |",      "|   | - | Zout  |",      "|   | - | Peper  |",      "|   | - | Nootmuskaat  |",      "|   | - | Melk  |"    ],    "s": [      "",      "",      "Snipper en fruit de ui. Doe daar de zuurkool, de rozijnen en een beetje water in. Laat dit 30 minuten stomen. Bak zachtjes de spekjes uit. Kook de aardappels gaar.",      "",      "Stamp de aardappels met het spekvet, de mosterd, zout, peper en nootmuskaat, en een beetje melk.",      "",      "Stamp daarna de afgegoten zuurkool erdoor, en schep de spekjes en perzik als laatste erdoorheen.",      "",      ""    ]  },  {    "t": "Appeltaart",    "p": 25,    "i": [      "|  105 | g | Suiker | voor de appels  |",      "|  105 | g | Suiker | voor het deeg  |",      "|  220 | g | Roomboter | koude blokjes  |",      "|  1/2 | tl | Zout |   |",      "|  330 | g | Bloem |   |",      "|  1 | st | Eieren | om te bestrijken  |",      "|  1 | st | Eieren | voor het deeg  |",      "|  2 | el | Water | koud  |",      "|  1200 | g | Appels | 50% Goudrenetten, 50% Elstar  |",      "|  60 | g | Paneermeel |   |",      "|  60 | g | Rozijnen |   |",      "|  3 | tl | Kaneel |   |",      "|  2 | el | Custardpoeder | of maizena, of aardappelzetmeel  |",      "|   | - | Koffieroom | scheutje  |",      "|   | - | Slagroom | een bus!  |"    ],    "s": [      "",      "",      "== Deeg==",      "",      "Meng de bloem met 110 g suiker en het zout. Snijd de boter in blokjes en kneed samen met 1 ei, het water en de bloem tot een soepel deeg (kan met deeghaken). Verpak het deeg in plasticfolie en laat circa 30 minuten in de koelkast rusten. Rol twee derde van het deeg, op een met bloem bestoven aanrecht, uit tot een ronde lap van 30 centimeter doorsnede. Hou de rest van het deeg apart. Vet de springvorm in en bekleed met het deeg (1 rol deeg om deegroller om te transporteren). Het is makkelijk te repareren met restjes deeg. Bestrooi de bodem met paneermeel.",      "",      "== Vulling==",      "",      "Verwarm de oven voor op 180 °C. Schil de appels, snijd in partjes en verwijder het klokhuis. Snijd de appels in platte plakjes en meng samen met 100 g suiker, rozijnen, kaneelpoeder en custardpoeder. Leg de appel in laagjes over de bodem en druk echt stevig aan.",      "",      "Rol de rest van het deeg uit tot een dikte van circa 2 millimeter. Snijd lange repen van circa 1,5 centimeter breed, leg ze kruislings over de taart in een rastervorm. Druk de randen goed aan en bestrijk de bovenkant met het ei dooier-roommengsel. Bak de taart in circa 1 uur goudbruin en gaar. Laat de taart afkoelen.",      ""    ]  },  {    "t": "Boterkoek",    "p": 25,    "i": [      "|  385 | g | Bloem  |",      "|  315 | g | Roomboter  |",      "|  260 | g | Suiker  |",      "|  1 | st | Vanillesuiker  |",      "|  3 | tl | Citroen sap  |",      "|  1 | el | Melk  |",      "|  165 | g | bloem  |",      "|  110 | g | suiker  |",      "|  135 | g | boter  |",      "|  1/2 | vanille | suiker  |",      "|  1 | tl | citroensap  |"    ],    "s": [      "",      "",      "Oven voorverwarmen op 200 graden.",      "",      "Koude boter in kleine blokjes snijden. Boter, bloem, suiker, zakje vanillesuiker en citroensap toevoegen. Met de hand alles door elkaar kneden tot het een homogene deegbal wordt (dat duurt even).",      "",      "Druk de deeg glad in de boterkoekvorm. Maak een ruitpatroon met een vork, en bestrijk de bovenkant met een heel klein beetje melk.",      "",      "De oven nu op 190 graden zetten, en de koek 35 minuten in de oven houden.",      "",      "Uit de oven de koek met een vlakke plaat nadrukken om de lucht eruit te halen. Eventueel grote luchtholtes doorprikken met een sate prikker.",      "",      "Goed laten afkoelen voor je het uit de vorm haalt.",      "",      "Bij een kleinere vorm (15 cm in plaats van 23 cm) is de verhouding als volgt:",      "",      ""    ]  },  {    "t": "Bretonse koek",    "p": 25,    "i": [      "|  80 | g | Roomboter |   |",      "|  60 | g | Suiker | witte basterd  |",      "|  1/2 | st | Eieren |   |",      "|  130 | g | Bloem |   |",      "|  1/2 | tl | Bakpoeder |   |",      "|  1 | st | Vanillesuiker |   |",      "|  1 | tl | Citroen sap |   |"    ],    "s": [      "",      "",      "Meng de boter, bloem, suiker, bakpoeder, vanillesuiker en het ei tot een homogeen deeg. Steek hier desgewenst figuren uit.",      "",      "Verwarm de oven voor op 160 graden. Bak in 20 minuten goudbruin.",      ""    ]  },  {    "t": "Brownies",    "p": 25,    "i": [      "|  100 | g | Chocolade | minstens 70% cacao  |",      "|  100 | g | Pruimen | Ontpitte pruimen  |",      "|  100 | g | Amandelen | met het jasje nog aan  |",      "|  140 | g | Roomboter |   |",      "|  2 | st | Eieren |   |",      "|  290 | g | Bruine suiker |   |",      "|  80 | g | Bloem |   |",      "|  1 1/4 | tl | Bakpoeder |   |",      "|  1/4 | tl | Zout |   |"    ],    "s": [      "",      "",      "Verwarm de oven voor op 180 graden. Snij de amandelen in grove stukken en rooster ze op een bakpapierje 9 minuten in de oven.",      "",      "Smelt de boter en de chocoladestukken in een stalen kom boven zacht kokend water (water mag de kom niet aanraken). Haal het van het vuur wanneer gesmolten en goed gemengd, en meng het vervolgens met de in stukken gesneden pruimen en amandelen.",      "",      "Mix in een andere kom de geslagen eieren, de bloem, het bakpoeder, het zout en de bruine basterd suiker. Voeg het chocolade mengsel toe en roer alles tot een homogeen beslag.",      "",      "Doe het beslag in een brownie ovenschaal en doe dit op 180 graden in de oven voor 40 minuten.",      "",      "Laat het daarna VOLLEDIG afkoelen voordat je het in stukken snijd.",      "",      "Je kunt vanille extract toevoegen (een thee lepel of een zakje vanille suiker). En ook twee eetlepels sterke koffie (of oplos koffie poeder).",      ""    ]  },  {    "t": "Cake",    "p": 25,    "i": [      "|  175 | g | Boter | BlueBand  |",      "|  175 | g | Zelfrijzend bakmeel |   |",      "|  175 | g | Suiker |   |",      "|  3 | st | Eieren |   |",      "|   | - | Zout |   |",      "|  100 | g | Rozijnen |   |"    ],    "s": [      "",      "",      "Klop de suiker, warme boter en het zout op. Voeg de eieren toe en klop door tot het een luchtige massa is. Spatel dan het",      "",      "",      "gezeefde meel erdoor. Voeg als laatste de krenten toe.",      "",      "Vet het cakeblik (25 cm) in, leg over de breedte een bakpapier er in en bestuif de overgebleven wanden met bloem.",      "",      "Verdeel het beslag in het blik en bak het in de oven op 180 graden in 80 minuten af.",      "",      "In plaats van de rozijnen kun je ook gember, 140 g noten of kaneel-appelschijfjes gebruiken.",      "",      "Voor een blik van 36 cm is het 260 g boter, meel en suiker, 5 eieren en 150 g rozijnen.",      ""    ]  },  {    "t": "Cheesecake",    "p": 26,    "i": [      "|  200 g | Monchou |   |",      "|  170 g | Yoghurt | Griekse!  |",      "|  1 tl | Vanillesuiker | niet suiker maar aroma  |",      "|  3 st | Eieren |   |",      "|  1/2 el | Maizena |   |",      "|  5 el | Stroop | Ahorn siroop  |",      "|  100 g | Frambozen |   |",      "|  100 g | Havermout |   |",      "|  - | Kaneel |   |",      "|  70 g | Boter | blueband  |",      "|  5 st | Dadels | of gedroogde abrikozen  |",      "|  1 st | Citroen |   |"    ],    "s": [      "",      "",      "Voor een 18 cm bakvorm.",      "",      "Doe de gesmolten boter bij de haver. Snij de dadels heel fijn en voeg toe, goed mengen, in de taartvorm (bodem papiertje) Druk aan en zet zolang in de koelkast.",      "",      "Verwarm de oven op 140 graden hetelucht.",      "",      "Mix de monchou met de Griekse yoghurt, vanille, rasp van de citroen schil en ahornsiroop door elkaar met een mixer. Voeg een voor een de eieren toe en mix deze er doorheen. Voeg op het laatst nog de maizena toe en mix even mee.",      "",      "Giet het mengsel over de bodem. Bewaar een paar mooie frambozen en pureer de rest. Schep een beetje van de frambozen-saus in hoopjes over de cheesecake en trek met een prikker of mes strepen hierdoor. Bak de cheesecake in ongeveer 60 tot 70 minuten gaar. Laat hem afkoelen. Verdeel de rest van de frambozen-saus over de gezonde cheesecake samen met de hele framboosjes.",      "",      "Laat afkoelen in de koelkast voordat je hem serveert.",      ""    ]  },  {    "t": "Drie in de pan",    "p": 26,    "i": [      "|  250 g | Bloem |   |",      "|  2 tl | Bakpoeder |   |",      "|  250 ml | Melk |   |",      "|  100 g | Rozijnen | en stukjes appel  |",      "|  1 st | Eieren |   |",      "|  1/8 tl | Zout |   |",      "|  - | Kaneel |   |",      "|  - | Suiker |   |"    ],    "s": [      "",      "",      "Melk beetje bij beetje mengen met de bloem en bakpoeder. Etc.",      ""    ]  },  {    "t": "Karnemelk Appeltaart uit Belgie",    "p": 26,    "i": [      "|  100 g | Suiker |   |",      "|  80 g | Bloem |   |",      "|  150 ml | Karnemelk |   |",      "|  3 st | Appels | Gewoon frisse Elstar is heel goed  |",      "|  125 g | Roomboter |   |",      "|  2 st | Eieren |   |"    ],    "s": [      "",      "",      "Smelt de boter in een kommetje.",      "",      "Vet een taartvorm in en bestuif met bloem.",      "",      "Omhul de bodem van de taartvorm met aluminium folie (anders heb je kans op lekken).",      "",      "Schil de appels en snijd het in dunne partjes.",      "",      "Maak een beslag van de suiker, bloem, karnemelk, en de 2 eieren. Probeer er goed lucht in te kloppen.",      "",      "Giet het beslag in de vorm, en bedek het met de dunne appelschijfjes.",      "",      "Een springvorm kan lekken, omhul dan de onderkant met alu-folie om het op te vangen.",      "",      "Bak op 200 graden in 40 minuten gaar.",      ""    ]  },  {    "t": "Kletskoppen",    "p": 26,    "i": [      "|  45 g | Bloem |   |",      "|  56 g | Roomboter | op kamertemperatuur  |",      "|  140 g | Bruine suiker | Eigenlijk lichte basterd suiker  |",      "|  1/4 tl | Kaneel |   |",      "|  28 g | Amandelen | reeds gepelde  |",      "|  1/8 tl | Zout |   |"    ],    "s": [      "",      "",      "Snij de amandelen in kleine stukjes.",      "",      "Verwarm de oven en de bakplaat voor op 200 graden.",      "",      "Verpulver het zout.",      "",      "Bloem, en ook de basterdsuiker zeven en mengen met het zout, de kaneel en de amandelen.. De boter in blokjes erbij, en tot een homogeen deeg kneden.",      "",      "Hak de amandelen in kleine stukjes en kneed dit ook door het deeg.",      "",      "Maak van het deeg kleine balletjes (iets groter dan een hazelnoot, circa 2 cm, circa 13 gram).",      "",      "Afzuigkap aanzetten. Leg de ietwat geplette balletjes op een bakpapier op het bakblik met een flinke tussenafstand (maximaal 6 per blik, liever 6). In de oven op 200 graden.",      "",      "Na ongeveer 10 minuten zijn ze gaar. Controleer altijd de eerste lading door te proeven (ze mogen niet taai blijken wanneer ze afgekoeld zijn, en niet verbrand proeven).",      "",      "Als je ze een beetje plat drukt op de plaat kan de baktijd korter.",      "",      "Het levert ongeveer 22 stuks op.",      ""    ]  },  {    "t": "Kniepertjes",    "p": 26,    "i": [      "|  135 g | Suiker |   |",      "|  1 st | Vanillesuiker | zakjes  |",      "|  193 g | Bloem |   |", t stijf is geworden (2-4 uur) kunnen de resterende vruchten erover worden verdeeld.",      ""    ]  },  {    "t": "Meringue",    "p": 27,    "i": [      "|  100 | g | Suiker | fijne kristal suiker  |",      "|  2 | st | Eieren | de eiwitten  |",      "|  1 | st | Vanillesuiker |   |",      "|   | - | Zout |   |"    ],    "s": [      "",      "",      "Maak apparatuur en schaap schoon met een klein beetje azijn.",      "",      "Klop de eiwitten op tot ze beginnen te schuimen.",      "",      "Dan doorkloppen en beetje bij beetje de suiker erbij.",      "",      "Net zolang doorkloppen tot je in het schuim geen suiker meer voelt.",      "",      "Dan 25 minuten in de oven op 160 graden. Daarna een uur in de oven laten staan..",      ""    ]  },  {    "t": "Monchou taart",    "p": 27,    "i": [      "|  1 | st | Klopvast |   |",      "|  240 | g | Bastognekoeken | Let op notenfabriek koek  |",      "|  140 | g | Boter | Blue band  |",      "|  1/4 | l | Slagroom |   |",      "|  200 | g | Monchou |   |",      "|  125 | g | Suiker |   |",      "|  1 | st | Vlaaivulling | zo'n blik  |"    ],    "s": [      "",      "",      "Vet de 26 cm springvorm in, leg op de bodem een bakpapierje.",      "",      "De koeken heel fijn raspen met de keuken machine.",      "",      "Boter smelten en mengen met de koekkruimels. Dit in de springvorm drukken met een lepel, en laten opstijven in de koelkast.",      "",      "Slagroom met klopvast (zonder suiker) stijf kloppen.",      "",      "Monchou met de suiker schuimig kloppen en daarbij de slagroom mengen.",      "",      "Dit mengsel glad verdelen in de springvorm.",      "",      "Daarbovenop de vlaaivulling verdelen.",      "",      "Enkele uren in de koelkast laten opstijven.",      ""    ]  },  {    "t": "Nieuwjaarskoeken",    "p": 27,    "i": [      "|  91 | g | Bruine suiker |   |",      "|  45 | g | Stroop |   |",      "|  183 | g | Bloem |   |",      "|  1,1 | st | Eieren |   |",      "|  45 | g | Roomboter |   |",      "|  55 | ml | Melk | warm  |",      "|  1 | st | Droge worst |   |",      "|   | - | Zout | snufje  |"    ],    "s": [      "",      "",      "Verwarm de boter en de melk in de magnetron. Los de bruine suiker, snufje zout en stroop hierin op. Voeg de bloem en de eieren toe, en meng het tot een stroperig deeg. Laat het 2 uur tot een dag in de koelkast rusten.",      "",      "Snij de worst in echt heel dunne plakjes (< 2 mm; de dikte bepaald de dikte van de koek). Leg vier plakjes in het ijzer tegen elkaar aan in het midden. Pak een lepel beslag, en doe meteen op de worst.",      "",      "Stevig aandrukken en 1 minuut laten bakken, of wachten op de ping (Cloer stand 4,5).",      "",      "Wanneer klaar, snijd de koek die over het randje is gelopen er af, want die wordt nooit hard en dat is niet lekker.",      "",      "Favoriet van Wim Lutke.",      "",      "2024, 24 koeken.",      ""    ]  },  {    "t": "Nieuwjaarsrolletjes",    "p": 27,    "i": [      "|  480 | g | Suiker |   |",      "|  2 1/2 | st | Vanillesuiker | Staat niet in het originele recept!  |",      "|  600 | g | Bloem |   |",      "|  2 1/2 | st | Eieren |   |",      "|  240 | g | Roomboter |   |",      "|  3 | st | Slagroom | spuitbus met ballon  |",      "|  135 | ml | Water | kokend  |",      "|  135 | ml | Melk |   |",      "|   | - | Zout | snufje  |"    ],    "s": [      "",      "",      "Los de suiker, snufje zout en de vanillesuiker op in het warme water/melk. Voeg de gesmolten boter, de bloem en de eieren toe, en meng het tot een stevig deeg. Laat het 2 uur tot een dag in de koelkast rusten.",      "",      "Schep een halve eetlepel beslag, en plaats dit in het bakijzer. Stevig aandrukken en 1'20 minuut laten bakken. Daarna snel om de ronde steel van een pollepel (12 mm diameter) draaien en af laten koelen. Ongeveer 85 rolletjes, goed voor de nieuwjaarsinstuif.",      ""    ]  },  {    "t": "Paastaart klein",    "p": 27,    "i": [      "|  5 | st | Eieren |   |",      "|  200 | g | Suiker |   |",      "|  34 | g | Poedersuiker |   |",      "|  22 | g | Maizena |   |",      "|   | - | Zout |   |",      "|  1 | st | Vanillesuiker |   |",      "|  140 | g | Boter | roomboter  |",      "|  1 | el | Koffie extract |   |",      "|   | - | Hagelslag | pure  |",      "|  2 tl Speculaaskruiden | afgestreken lepels  |",      "|  70 g Zelfrijzend bakmeel |   |",      "|  50 g Roomboter |   |",      "|  40 g Bruine suiker |   |",      "|  3 tl Melk | niet meer!  |",      "|  - Zout |   |",      "|  75 g | Suiker  |",      "|  150 g | Roomboter koude blokjes  |",      "|  225 g | Bloem  |",      "|  2 st | Eieren  |",      "|  1 st | Appels | Goudrenet  |",      "|  50 g | Noten | pecan noten bijvoorbeeld  |",      "|  20 g | Rozijnen |   |",      "|  40 g | Suiker |   |",      "|  1 tl | Kaneel |   |",      "|  1 el | Maizena |   |",      "|  1/4 tl | Zout |   |",      "|  80 g | Poedersuiker | meer indien nodig  |",      "|  1 tl | Citroen sap |   |",      "|  1 tl | Water |   |",      "|  6 st | Pepermuntjes |   |",      "|  125 g | Chocolade | puur, >70%  |",      "|  1 st | Pompoen | 500 gram vruchtvlees  |",      "|  400 ml | Melk | zoete, gecondenseerde  |",      "|  2 st | Eieren |   |",      "|  1 tl | Kaneel |   |",      "|  1/2 tl | Gemberpoeder |   |",      "|  1/2 tl | Nootmuskaat |   |",      "|  110 g | Roomboter |   |",      "|  170 g | Bloem |   |",      "|  1/2 tl | Azijn |   |",      "|  50 ml | Water | ijswater  |",      "|  20 g | Suiker | fijne of poeder  |"    ],    "s": [      "",      "",      "Dit is een taart voor een 18 cm vorm. Voor een 24 cm vorm moet de factor 1.79 erover.",      "",      "Kapsel:",      "",      "1 ei en 4 eiwitten",      "",      "110 g suiker",      "",      "iets zout NIET VERGETEN",      "",      "90 g bloem",      "",      "22 g maizena",      "",      "",      "Kom (voor)verwarmen in magnetron 18 cm taartvorm beboteren, alleen bodem bedekken met bakpapier en randen met meel bestuiven. Suiker en ei luchtig kloppen (minstens 10 minuten), daarna de gezeefde bloem en maizena erbij. In vorm en 30 minuten op 180 graden in de oven. Goed laten uitwasmen.",      "",      "Roomvla:",      "",      "280 ml melk (mag halfvolle zijn)",      "",      "4 ei dooiers",      "",      "1 zakje vanillesuiker",      "",      "80 g suiker",      "",      "2 el bloem",      "",      "Melk tegen de kook aanbrengen, ei dooiers met suiker en bloem goed mengen in een andere kom. Klein beetje warme melk bij de eieren, en dat mengsel vervolgens op het matig vuur. Roeren tot je een dikke massa krijgt, dan vuur uit en laten afkoelen.",      "",      "Mokka creme",      "",      "140 g roomboter op kamertemperatuur",      "",      "34 g poedersuiker",      "",      "1 eetlepel poederkoffie en 17 g suiker opgelost in 40 ml warme melk",      "",      "Kook melk met poederkoffie en suiker in tot een vloeibaar drabje. Mix de boter, los de poedersuiker er in op, en voeg beetje bij beetje de melk toe. Meng dit met 2/3 van de roomvla, en laat dit op een platte schaal afkoelen in de koelkast.",      "",      "Kapsel in 3en snijden. Onderste met 1/3 van de mokka creme, middelste kapsel met de overgebleven roomvla.",      "",      "Vervolgens het laatste kapsel er op, weer 1/3 van de mokka creme erop, en vanaf de bovenkant ook de zijkant hiermee besmeuren (paletmes)",      "",      "De zijkant kun je vervolgens garneren met bijvoorbeeld pure hagelslag.",      "",      "Met de resterende mokka creme roosjes en nestjes spuiten en vullen met suiker eitjes. Je kunt de rand ook versieren met halve chocolade eitjes.",      "",      "_Pepernoten",      "",      "",      "Boter zacht maken (niet smelten) in een kom. Voeg kruiden, meel en suiker toe en meng alles goed met een houten lepel. Vorm daarna een bal met de handen. Haal uit de bal de pepernoten (grootte als kersen).",      "",      "Of rol een heel dunne worst, en snij daar blokjes uit die je vervolgens als een bol rolt. Let op, kleine bolletjes maken, want de noten groeien in de oven nog.",      "",      "Leg die op bakpapier op een bakplaat. Doe ze 20 min in de oven op 160 graden.",      "",      "_Pi-Pie",      "",      "",      "",      "Deeg",      "",      "Kneed met deeghaken de bloem, 75 g suiker, zout, boter in blokjes, en 1 ei tot een soepel deeg. Verpak het deeg in plasticfolie en laat circa 30 minuten in de koelkast rusten. Rol twee derde van het deeg, op een met bloem bestoven aanrecht. Snij er rondjes uit die passen op de kleine taartvormpjes. Hou de rest van het deeg apart. Vet de springvorm in en bekleed met het deeg. Het is makkelijk te repareren met restjes deeg. Bestrooi de bodem met paneermeel.",      "",      "Vulling",      "",      "Hak de noten in kleinere stukken.",      "",      "Verwarm de oven voor op 180 °C. Schil de appels, verwijder het klokhuis en snijd in kleine blokjes. Meng samen met 40 g suiker, rozijnen, noten, kaneelpoeder en maizena. Leg de appel over de bodem en druk echt stevig aan.",      "",      "Rol de rest van het deeg uit tot een dikte van circa 2 millimeter. Snijd repen en maak hiermee de letter PI op het gebakje. Bestrijk de bovenkant met het ei dooier-melk mengsel. Bak de taart in circa 40 min goudbruin en gaar. Laat de taart afkoelen.",      "",      "_Princesse truffels",      "",      "",      "Verpulver de pepermuntjes (ijzeren opscheplepel, en tussen een keukenpapiertje, in de garage op een plank).",      "",      "Gebruik 1 tl citroensap en 1 tl water om 80 gram poedersuiker te mengen met een lepel tot een dik deeg. Voeg poedersuiker toe om het vaster te maken indien nodig.",      "",      "Rol het tot een dunne worst zodat je er kleine bolletjes van kunt draaien (kleiner dan een knikker, ze zijn al gauw te groot!)",      "",      "Smelt de chocolade. Dip de snoepjes voor de helft in de chocolade en leg ze op de bakpapier/bakplaat (vork om uit te lekken, lepel om af te glijden op het bakpapier). Laat het in de koelkast weer stollen.",      "",      "_Pumpkin Pie",      "",      "",      "",      "Maak pompoen puree door 20 min te koken, afgieten en pureren.",      "",      "Doe de boter, bloem, suiker, azijn en water in de keukenmachine en mix met het mes tot er heel kleine klontjes overblijven. Er moeten stukjes boter in blijven om de korst luchtig te maken.",      "",      "Druk het deeg in elkaar in een folie en laat het in de koelkast rusten.",      "",      "Doe het deeg dan in een pie vorm, en maak een golfjes patroon aan de rand.",      "",      "Meng de pompoen puree met de melk, specerijen en eieren, en mix dit glad. Giet het in het korstdeeg.",      "",      "Doe in de voorverwarmde over 15 min op 220 graden, en vervolgens 35 min op 180 graden afbakken",      ""    ]  },  {    "t": "Scones",    "p": 29,    "i": [      "|  225 g | Zelfrijzend bakmeel |   |",      "|  75 g | Roomboter |   |",      "|  40 g | Suiker | Witte basterd  |",      "|  1 st | Eieren |   |",      "|  2 tl | Melk |   |",      "|  - | Zout |   |"    ],    "s": [      "",      "",      "Verwarm de oven voor op 220 graden.",      "",      "Roomboter op kamertemperatuur brengen en met het gezeefde bakmeel en een snufje zout verkruimelen. Daarna de suiker erbij mengen. In een andere kom het ei met de melk loskloppen en vervolgens bij het deeg kneden.",      "",      "Het deeg op 2.5 cm uitrollen en met een 5 cm ronde steker uitsteken. Restjes deeg weer opnieuw kneden, rollen en steken tot alles op is. (9 stuks)",      "",      "Leg de scones op bakpapier op een bakplaat, en bestrijk ze licht met wat melk.",      "",      "Bak de scones af in 14 minuten op 220 graden in de oven.",      "",      "Warm serveren, smeren met echte boter en jam.",      ""    ]  },  {    "t": "Slagroomtaart",    "p": 29,    "i": [      "|  8 st | Eieren |   |",      "|  250 g | Suiker |   |",      "|  200 g | Bloem |   |",      "|  40 g | Maizena |   |",      "|  - | Zout |   |",      "|  250 ml | Melk |   |",      "|  2 st | Vanillesuiker |   |",      "|  2 st | Klopvast |   |",      "|  500 ml | Slagroom |   |"    ],    "s": [      "",      "",      "Kapsel:",      "",      "6 eieren",      "",      "200 g suiker",      "",      "160 g bloem",      "",      "40 g maizena",      "",      "iets zout NIET VERGETEN",      "",      "kom eventueel (voor)verwarmen.",      "",      "24 cm taartvorm beboteren en met meel bestuiven.",      "",      "Eventueel boven met bakpapier.",      "",      "suiker en ei luchtig kloppen (minstens 12 minuten), mengen met de gezeefde bloem, maizena en zout.",      "",      "In vorm en 40 minuten op 185 graden in de oven",      "",      "Goed laten uitwasmen.",      "",      "Roomvla:",      "",      "250 ml melk (mag halfvolle zijn)",      "",      "2 eieren",      "",      "2 zakjes vanillesuiker",      "",      "50 g suiker",      "",      "25 g bloem",      "",      "melk tegen de kook aanbrengen",      "",      "eieren met suiker en bloem goed mengen",      "",      "bij de melk voegen, en roeren tot je een dikke massa krijgt, dan vuur uit..",      "",      "laten afkoelen.",      "",      "Klopvast en 0.5 L slagroom",      "",      "0.25 voor de vulling, stevig geklopt, 1 vanillesuiker & 1",      "",      "theelepel suiker & 1 klopvast",      "",      "0.25 voor het omhullen, minder stevig geklopt, 1 vanillesuiker",      "",      "& 1 theelepel suiker & 1 klopvast",      "",      "Eventueel kun je 0.2 om 0.2 doen, en 0.1 slagroom",      "",      "overhouden voor toefjes.",      "",      "Kapsel in 3en snijden. Onderste met roomvla vullen.",      "",      "Middelste kapsel er op, heel licht bestrijken met jam. Dan de stijve slagroom erop.",      "",      "Vervolgens het laatste kapsel er op, de minder stijve slagroom er bovenop en vanaf de bovenkant ook de zijkant besmeuren met slagroom. Het afwerken gaat het mooist met een warm palet mes.",      "",      "De zijkant kun je vervolgens garneren met bijvoorbeeld hagelslag. De bovenkant garneren met vruchtjes, toefjes slagroom. De taart wordt zo hoog dat je hem in wel 14-16 stukken kunt snijden.",      ""    ]  },  {    "t": "Speculaasjes",    "p": 29,    "i": [      "|  225 g | Zelfrijzend bakmeel | 50/50 met gewoon meel  |",      "|  100 g | Roomboter |   |",      "|  1 st | Eieren |   |",      "|  113 g | Bruine suiker |   |",      "|  2 tl | Speculaaskruiden |   |",      "|  - | Zout | snuf niet vergeten!  |"    ],    "s": [      "",      "",      "Maak een deeg van de ingredienten en koel het in de koelkast. Vet de speculaas plank in en bestrooi met bloem.",      "",      "Druk een gedeelte van het deeg in 1 vorm en snij het te vele met een mes eraf. Probeer nu het speculaasje er voorzichtig af te krijgen en op een bakplaat te leggen. Afbakken op 180 graden in 15 minuten.",      ""    ]  },  {    "t": "Spritsen",    "p": 29,    "i": [      "|  112 g | Roomboter |   |",      "|  50 g | Suiker | witte basterd suiker  |",      "|  1/2 st | Vanillesuiker |   |",      "|  125 g | Bloem |   |",      "|  1/4 tl | Bakpoeder |   |",      "|  - | Zout |   |"    ],    "s": [      "",      "",      "Verwarm de oven voor op 180 graden.",      "",      "Laat de roomboter op kamertemperatuur komen, en roer deze tot een room. Voeg de suiker en vanille suiker toe en meng alles tot een gladde massa. Daarna het gezeefde bloem, snufje zout en bakpoeder erdoor scheppen tot een zacht homogeen deeg ontstaat. Bak ze in 22 min af.",      ""    ]  },  {    "t": "Stroopwafels",    "p": 29,    "i": [      "|  250 g | Bloem |   |",      "|  125 g | Roomboter |   |",      "|  75 g | Suiker | Witte basterdsuiker  |",      "|  7 g | Gist |   |",      "|  1 st | Eieren |   |"    ],    "s": [      "",      "",      "",      "1 tl Kaneel",      "240 g Stroop",      "140 g Suiker Bruine basterdsuiker",      "50 g Roomboter",      "",      "Maak een scheutje melk lauwwarm en laat de gist daarin in 10 minuten oplossen. Verwarm de boter een beetje en voeg de witte suiker, de bloem, het kaneel en het ei toe. Daarbij ook de opgeloste gist. Nu goed kneden. Het deeg een uur wegzetten bij kamertemperatuur om te laten rijzen. Doe de stroop, bruine suiker en roomboter in een steelpannetje en laat in 10-15 minuten de suiker erin oplossen (niet laten koken).",      "",      "Het deeg opnieuw kneden en in pingpongballen maken. De Cloer op stand 5. Het balletje deeg in het wafelijzer, en heel zachtjes dichtdrukken. Iets te hard drukken resulteert in een plat kantje wat niet meer open te snijden is. Gebruik anders een stukje van een lange satestok om aan 1 kant de Cloer wat open te houden (een tandenstoker was te dun daarvoor). Na het signaal van de Cloer de wafel er snel uithalen, horizontaal doormidden snijden en vullen met de stroop. Bovenstaande hoeveelheid geeft ongeveer 20 koeken.",      ""    ]  },  {    "t": "Tulband, Kerst",    "p": 30,    "i": [],    "s": [      "",      "250 g Zelfrijzend",      "250 g Olie zonnebloem",      "25 ml Yoghurt",      "200 g Suiker witte basterd",      "2 st Vanillesuiker",      "4 st Eieren",      "110 g Poedersuiker",      "1 el Citroen sap",      "100 g Rozijnen",      "100 g Rozijnen gewelde gedroogde",      "100 g Rozijnen gedr abrikozen",      "",      "Met echte bastard suiker wordt de cake zachter!",      "",      "Wel de gedroogde vruchten in water met wat siroop (2 uur). Verwarm de oven voor op 175 °C. Vet tulband vorm heel erg goed in en bestuif met bloem.",      "",      "Klop in een beslagkom de olie, yoghurt, basterdsuiker en vanillesuiker met de mixer in ca. 10 min. (echt) tot een crèmekleurige, romige massa. Klop de eieren er een voor een door; voeg pas het volgende ei toe als het vorige helemaal door botermengsel is opgenomen. Voeg het gezeefde zelfrijzend bakmeel in drie tot vier keer toe en meng met een spatel luchtig door het beslag. Spatel de rozijnen en sukade er ook luchtig door. Doe het beslag over in de tulbandvorm en strijk de bovenkant glad.",      "",      "Schuif de vorm op het rooster in het midden van de oven en laat de tulband in ca. 1 uur goudbruin en gaar bakken (erin gestoken satéstokje komt er dan droog uit).",      "",      "Prik na 45 min elke 5 min!",      "",      "1. Haal de tulband na het bakken uit de oven.",      "2. Laat hem 10-15 minuten afkoelen in de vorm (dit maakt de cake steviger en helpt loslaten).",      "3. Stort de tulband op een rooster.",      "4. Plaats de (schone) tulbandvorm weer over de cake terwijl hij verder afkoelt. De condens die vrijkomt wordt dan opnieuw opgenomen door de cake, waardoor deze minder uitdroogt.",      "",      "Meng de poedersuiker met ongeveer 1 el citroensap, totdat",      "",      "het net een beetje vloeit. Bedek de tulband hiermee, en versier met suikerparels o.i.d.",      ""    ]  },  {    "t": "Welsh cakes",    "p": 30,    "i": [      "- Zout snuf"    ],    "s": [      "",      "115 g Bloem",      "55 g Boter",      "40 g Suiker Witte basterd, eigenlijk fijne",      "30 g Rozijnen echt dikke rozijnen, geen krenten",      "1/2 tl Bakpoeder",      "1/4 tl Kaneel",      "1/8 tl Nootmuskaat",      "1/8 tl Kruidnagels verpulverd",      "1 el Melk",      "1/2 st Eieren",      "",      "Zeef de bloem, bakpoeder, kruiden en zout in een kom. Snij de boter in blokjes erbij, en kneed tot het mengsel op broodkruimels lijkt. Voeg de suiker en rozijnen toe. Kluts het ei en doe de helft daarvan erbij, samen met de melk om een stevig deeg te maken.",      "",      "Rol het deeg uit op een bloem bestoven werkblad tot een dikte van ongeveer 6 mm (rozijn dikte). Steek er rondjes van 5 cm uit.",      "",      "Vet een pan met dikke bodem in en maak deze medium warm. Bak de cakes 2-3 minuten per kant tot ze goudbruin zijn. Laat afkoelen en besprenkel met fijne kristalsuiker (of poedersuiker).",      "",      "Kaal serveren, of met boter.",      "",      "2020: 2.5 recept is 30 stuks",      "",      "30"    ]  }];

function savePlanner() { try { localStorage.setItem('weekplanner', JSON.stringify(state.planner)); } catch (e) {} }
function loadDone() {
  try { return new Set(JSON.parse(localStorage.getItem('boodschappen-done') || '[]')); } catch (e) { return new Set(); }
}
function saveDone(done) { try { localStorage.setItem('boodschappen-done', JSON.stringify([...done])); } catch (e) {} }
if (!state.planner) state.planner = loadPlanner();

function buildShoppingList() {
  const byKey = new Map();
  const noAmt = new Map();
  DAYS.forEach(day => {
    const slug = state.planner[day];
    if (!slug || !bySlug[slug]) return;
    const r = bySlug[slug];
    r.i.forEach(raw => {
      const p = parseIngRaw(raw);
      const name = p.name.trim();
      if (!name) return;
      if (p.num == null) { noAmt.set(name.toLowerCase(), { name, note: p.note }); return; }
      let { num, unit } = p;
      if (unit === 'kg') { num *= 1000; unit = 'g'; }
      if (unit === 'l') { num *= 1000; unit = 'ml'; }
      const key = name.toLowerCase() + '|' + unit;
      if (byKey.has(key)) byKey.get(key).num += num;
      else byKey.set(key, { num, unit, name, note: p.note });
    });
  });
  const items = [...byKey.values()].map(it => ({
    label: scaleAmount(it.num, it.unit, 1), name: it.name, note: it.note, key: 'a|' + it.name.toLowerCase() + '|' + it.unit
  }));
  noAmt.forEach(it => items.push({ label: '', name: it.name, note: it.note, key: 'b|' + it.name.toLowerCase() }));
  return items;
}

function renderPlanner() {
  let items = [];
  try { items = buildShoppingList(); } catch (e) { items = []; }
  const done = loadDone();
  app.innerHTML = `
    <h2 style="font-weight:normal;color:var(--terra-dark);margin:4px 0 14px;">Weekplanner</h2>
    <div class="planner-grid">
      ${DAYS.map(day => {
        const slug = state.planner[day];
        const r = slug && bySlug[slug];
        return `
        <div class="day">
          <h3>${day}</h3>
          <select data-day="${day}">
            <option value="">&ndash; kies een recept &ndash;</option>
            <optgroup label="Maaltijden">
              ${RECIPES.filter(x => CAT(x) === 'maaltijd').map(x => `<option value="${x.slug}" ${slug===x.slug?'selected':''}>${x.t}</option>`).join('')}
            </optgroup>
            <optgroup label="Gebak">
              ${RECIPES.filter(x => CAT(x) === 'gebak').map(x => `<option value="${x.slug}" ${slug===x.slug?'selected':''}>${x.t}</option>`).join('')}
            </optgroup>
          </select>
          ${r ? `<div class="planned">${r.t}</div>` : ''}
        </div>`;
      }).join('')}
    </div>
    <section class="shop" id="printable">
      <h2>Boodschappenlijst</h2>
      <div class="sub">Automatisch samengesteld uit de recepten van deze week. Tik een regel af na het winkelen.</div>
      ${items.length ? `
      <ul class="shoplist">
        ${items.map(it => `
          <li class="${done.has(it.key) ? 'done' : ''}" data-key="${it.key}">
            <input type="checkbox" ${done.has(it.key) ? 'checked' : ''} />
            <span class="amt">${it.label}</span>
            <span class="txt">${it.name}${it.note ? ` <span class="note">(${it.note})</span>` : ''}</span>
          </li>`).join('')}
      </ul>` : '<p style="color:var(--muted);font-style:italic;">Kies eerst recepten in de planner hierboven.</p>'}
      <div class="shopbtns">
        <button class="printbtn" onclick="window.print()">&#128424; Print boodschappenlijst</button>
        <button class="printbtn" id="clear-done">&#10003; Vinkjes wissen</button>
        <button class="printbtn" id="clear-planner">Week leegmaken</button>
      </div>
    </section>`;
  app.querySelectorAll('.day select').forEach(sel => sel.addEventListener('change', () => {
    const d = sel.dataset.day;
    if (sel.value) state.planner[d] = sel.value; else delete state.planner[d];
    savePlanner(); renderPlanner();
  }));
  app.querySelectorAll('.shoplist li').forEach(li => li.addEventListener('click', e => {
    e.preventDefault();
    const done2 = loadDone();
    const k = li.dataset.key;
    if (done2.has(k)) done2.delete(k); else done2.add(k);
    saveDone(done2); renderPlanner();
  }));
  const cd = document.getElementById('clear-done');
  if (cd) cd.addEventListener('click', () => { saveDone(new Set()); renderPlanner(); });
  const cp = document.getElementById('clear-planner');
  if (cp) cp.addEventListener('click', () => { state.planner = {}; savePlanner(); renderPlanner(); });
}

const GEBak_EXTRA = new Set(['cruesli-koekjes']);
const CAT = r => (r.p >= 25 || GEBak_EXTRA.has(r.slug)) ? 'gebak' : 'maaltijd';
const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
RECIPES.forEach(r => r.slug = slugify(r.t));
const bySlug = Object.fromEntries(RECIPES.map(r => [r.slug, r]));

// ---- amount parsing & scaling ----
function fracToNum(s) {
  s = s.trim().replace(',', '.');
  let m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if (m) return +m[1] + (+m[2]) / (+m[3]);
  m = s.match(/^(\d+)\/(\d+)$/);
  if (m) return (+m[1]) / (+m[2]);
  if (s && !isNaN(parseFloat(s))) return parseFloat(s);
  return null;
}

function fmtNum(x) {
  const FR = [[0.5,'\u00bd'],[0.25,'\u00bc'],[0.75,'\u00be'],[1/3,'\u2153'],[2/3,'\u2154'],[0.125,'\u215b'],[0.375,'\u215c'],[0.625,'\u215d'],[0.875,'\u215e']];
  const whole = Math.floor(x + 1e-9);
  let frac = x - whole;
  if (frac < 0.02) return String(whole);
  for (const [v, ch] of FR) {
    if (Math.abs(frac - v) < 0.03) return (whole ? whole + '' : '') + ch;
  }
  const rounded = Math.round(x * 10) / 10;
  return String(rounded).replace('.', ',');
}

function scaleAmount(amount, unit, factor) {
  let val = amount * factor;
  let u = unit;
  if (u === 'g' && val >= 1000 && val % 250 === 0) { val /= 1000; u = 'kg'; }
  else if (u === 'ml' && val >= 1000 && val % 250 === 0) { val /= 1000; u = 'l'; }
  else if (u === 'l' && val < 1) { val *= 1000; u = 'ml'; }
  return fmtNum(val) + (u ? ' ' + u : '');
}

// returns {num: number|null, unit: string|null, name: string, note: string|null} (unscaled)
function parseIngRaw(raw) {
  let s = raw.trim();
  if (s.startsWith('|')) {
    const cells = s.split('|').slice(1, -1).map(c => c.trim());
    // |   | - | Olie |  -> geen hoeveelheid
    if (cells.length >= 3 && (cells[0] === '' || cells[0] === '-') && (cells[1] === '-' || cells[1] === '')) {
      return { num: null, unit: null, name: cells[2] || '', note: cells[3] || null };
    }
    // klassiek: | 200 | g | Naam | opmerking |
    if (cells.length >= 3 && /^(g|kg|ml|l|el|tl|st)$/i.test(cells[1] || '')) {
      const num = fracToNum(cells[0] || '');
      return { num, unit: num != null ? cells[1].toLowerCase() : null, name: cells[2] || '', note: cells[3] || null };
    }
    // gecombineerd: | 400 g | Naam | opmerking |
    const cm = (cells[0] || '').match(/^([\d.,\/ ]+?)\s*(g|kg|ml|l|el|tl|st)$/i);
    if (cm) {
      const num = fracToNum(cm[1]);
      return { num, unit: num != null ? cm[2].toLowerCase() : null, name: cells[1] || '', note: cells[2] || null };
    }
    // terugval: eerste gevulde cel is de naam
    const nm = cells.find(c => c && c !== '-');
    return { num: null, unit: null, name: nm || '', note: null };
  }
  s = s.replace(/^[-\u2022]\s*/, '');
  const m = s.match(/^([\d.,\/ ]+?)\s*(g|kg|ml|l|el|tl|st)\b\s*(.*)$/i);
  if (m) {
    const num = fracToNum(m[1]);
    return { num, unit: num != null ? m[2].toLowerCase() : null, name: m[3], note: null };
  }
  return { num: null, unit: null, name: s, note: null };
}

// returns {amt: string|null, name: string, note: string|null}
function parseIng(raw) {
  const p = parseIngRaw(raw);
  return { amt: p.num != null ? scaleAmount(p.num, p.unit || '', state.factor) : null, name: p.name, note: p.note };
}

// ---- rendering ----
function render() {
  document.getElementById('nav-recipes').classList.toggle('active', state.view !== 'planner');
  document.getElementById('nav-planner').classList.toggle('active', state.view === 'planner');
  if (state.view === 'planner') { renderPlanner(); return; }
  if (state.view === 'recipe' && state.slug && bySlug[state.slug]) { renderRecipe(); return; }
  renderList();
}
document.getElementById('nav-recipes').addEventListener('click', () => {
  state.view = 'list'; state.slug = null; location.hash = ''; window.scrollTo(0, 0); render();
});
document.getElementById('nav-planner').addEventListener('click', () => {
  state.view = 'planner'; window.scrollTo(0, 0); render();
});

function renderList() {
  const q = state.q.toLowerCase();
  const items = RECIPES.filter(r =>
    (state.cat === 'all' || CAT(r) === state.cat) &&
    (!q || r.t.toLowerCase().includes(q))
  );
  app.innerHTML = `
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="Zoek een recept\u2026" value="${state.q.replace(/"/g,'&quot;')}" />
      <div class="tabs">
        <button class="tab ${state.cat==='all'?'active':''}" data-cat="all">Alles</button>
        <button class="tab ${state.cat==='maaltijd'?'active':''}" data-cat="maaltijd">Maaltijden</button>
        <button class="tab ${state.cat==='gebak'?'active':''}" data-cat="gebak">Gebak</button>
      </div>
    </div>
    <p class="count">${items.length} recepten</p>
    <div class="grid">
      ${items.map(r => `
        <div class="card" data-slug="${r.slug}">
          <h3>${r.t}</h3>
          <div class="cat">${CAT(r) === 'gebak' ? 'Gebak' : 'Maaltijd'}</div>
        </div>`).join('')}
    </div>`;
  const qi = document.getElementById('q');
  qi.addEventListener('input', e => {
    state.q = e.target.value;
    const pos = e.target.selectionStart;
    renderList();
    const nq = document.getElementById('q');
    nq.focus(); nq.setSelectionRange(pos, pos);
  });
  app.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { state.cat = b.dataset.cat; render(); }));
  app.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => {
    state.view = 'recipe'; state.slug = c.dataset.slug; state.factor = 1;
    location.hash = c.dataset.slug; window.scrollTo(0, 0); render();
  }));
}

function renderRecipe() {
  const r = bySlug[state.slug];
  const ings = r.i.map(parseIng);
  const stepsHtml = r.s.map(line => {
    const t = line.trim();
    if (!t) return '';
    if (t.startsWith('==')) return `</ol><div class="stepsub">${t.replace(/^=+\s*|\s*=+$/g, '')}</div><ol class="steps">`;
    return `<li>${t}</li>`;
  }).join('');
  app.innerHTML = `
    <button class="back" id="back">&larr; Terug naar alle recepten</button>
    <article class="recipe" id="printable">
      <h2>${r.t}</h2>
      <div class="meta">${CAT(r) === 'gebak' ? 'Gebak' : 'Maaltijd'}</div>
      <div class="portions">
        <span class="label">Hoeveelheden:</span>
        ${[0.5, 1, 1.5, 2, 3].map(f =>
          `<button class="pbtn ${state.factor===f?'active':''}" data-f="${f}">${f===1?'origineel':('\u00d7' + String(f).replace('.', ','))}</button>`).join('')}
      </div>
      <div class="cols">
        <div class="ing">
          <h4>Ingredi\u00ebnten</h4>
          <ul class="ings">
            ${ings.map(g => `<li><span class="amt">${g.amt || ''}</span><span>${g.name}${g.note ? ` <span class="note">(${g.note})</span>` : ''}</span></li>`).join('')}
          </ul>
        </div>
        <div class="steps">
          <h4>Bereiding</h4>
          <ol class="steps">${stepsHtml}</ol>
        </div>
      </div>
      <button class="printbtn" onclick="window.print()">&#128424; Print dit recept</button>
    </article>`;
  document.getElementById('back').addEventListener('click', () => {
    state.view = 'list'; state.slug = null; location.hash = ''; render();
  });
  app.querySelectorAll('.pbtn').forEach(b => b.addEventListener('click', () => {
    state.factor = parseFloat(b.dataset.f); renderRecipe();
  }));
}

window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (h && bySlug[h]) { state.view = 'recipe'; state.slug = h; state.factor = 1; }
  else { state.view = 'list'; state.slug = null; }
  render();
});
if (location.hash && bySlug[location.hash.slice(1)]) {
  state.view = 'recipe'; state.slug = location.hash.slice(1);
}
render();
</script>
</body>
</html>
