<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Receptenboek</title>
<style>
  :root {
    --bg: #faf6f0;
    --card: #ffffff;
    --ink: #3d3229;
    --muted: #8a7c6e;
    --terra: #c96f4a;
    --terra-dark: #a8542f;
    --terra-light: #f3e0d5;
    --line: #eadfd2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
  }
  header.site {
    background: linear-gradient(135deg, var(--terra) 0%, var(--terra-dark) 100%);
    color: #fff;
    padding: 28px 20px 22px;
    text-align: center;
  }
  header.site h1 { margin: 0; font-size: 1.9rem; font-weight: normal; letter-spacing: 0.5px; }
  header.site p { margin: 6px 0 0; opacity: 0.9; font-style: italic; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; align-items: center; }
  .search {
    flex: 1 1 220px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 24px;
    font: inherit;
    background: var(--card);
    color: var(--ink);
  }
  .tabs { display: flex; gap: 6px; }
  .tab {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    border-radius: 20px;
    padding: 8px 16px;
    font: inherit;
    font-size: 0.92rem;
    cursor: pointer;
  }
  .tab.active { background: var(--terra); border-color: var(--terra); color: #fff; }
  .count { color: var(--muted); font-size: 0.9rem; font-style: italic; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    cursor: pointer;
    transition: box-shadow 0.15s, transform 0.15s;
  }
  .card:hover { box-shadow: 0 4px 14px rgba(120, 80, 40, 0.12); transform: translateY(-2px); }
  .card h3 { margin: 0 0 4px; font-size: 1.05rem; font-weight: normal; color: var(--terra-dark); }
  .card .cat { font-size: 0.8rem; color: var(--muted); font-style: italic; }
  /* Recipe view */
  .recipe { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px 28px; }
  .back { background: none; border: none; color: var(--terra-dark); font: inherit; cursor: pointer; padding: 0; margin-bottom: 14px; font-style: italic; }
  .back:hover { text-decoration: underline; }
  .recipe h2 { margin: 0 0 2px; font-weight: normal; font-size: 1.7rem; color: var(--terra-dark); }
  .recipe .meta { color: var(--muted); font-style: italic; font-size: 0.9rem; margin-bottom: 18px; }
  .portions {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
    background: var(--terra-light);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 20px;
  }
  .portions .label { font-size: 0.92rem; margin-right: 4px; }
  .pbtn {
    border: 1px solid var(--terra);
    background: #fff;
    color: var(--terra-dark);
    border-radius: 18px;
    padding: 5px 13px;
    font: inherit;
    cursor: pointer;
  }
  .pbtn.active { background: var(--terra); color: #fff; }
  .cols { display: grid; grid-template-columns: minmax(220px, 340px) 1fr; gap: 28px; }
  @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
  .ing h4, .steps h4 { margin: 0 0 10px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); font-family: system-ui, sans-serif; }
  ul.ings { list-style: none; margin: 0; padding: 0; }
  ul.ings li { padding: 6px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 8px; }
  ul.ings .amt { min-width: 72px; font-weight: bold; color: var(--terra-dark); white-space: nowrap; }
  ul.ings .note { color: var(--muted); font-style: italic; font-size: 0.9em; }
  ol.steps { margin: 0; padding-left: 20px; }
  ol.steps li { margin-bottom: 10px; }
  .stepsub { font-weight: bold; color: var(--terra-dark); margin: 16px 0 6px; }
  .printbtn {
    margin-top: 22px;
    border: 1px solid var(--terra);
    background: #fff;
    color: var(--terra-dark);
    border-radius: 8px;
    padding: 8px 18px;
    font: inherit;
    cursor: pointer;
  }
  .printbtn:hover { background: var(--terra); color: #fff; }
  footer.site { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 20px; font-style: italic; }
  /* Nav */
  .mainnav { margin-top: 16px; display: flex; gap: 8px; justify-content: center; }
  .navbtn {
    border: 1px solid rgba(255,255,255,0.6);
    background: transparent;
    color: #fff;
    border-radius: 20px;
    padding: 7px 18px;
    font: inherit;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .navbtn.active { background: #fff; color: var(--terra-dark); border-color: #fff; }
  /* Planner */
  .planner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .day h3 { margin: 0 0 8px; font-size: 1rem; font-weight: normal; color: var(--terra-dark); }
  .day select {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    font-size: 0.9rem;
    background: var(--bg);
    color: var(--ink);
  }
  .day .planned { margin-top: 8px; font-size: 0.9rem; color: var(--terra-dark); font-style: italic; }
  .shop { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; }
  .shop h2 { margin: 0 0 4px; font-weight: normal; font-size: 1.4rem; color: var(--terra-dark); }
  .shop .sub { color: var(--muted); font-style: italic; font-size: 0.9rem; margin-bottom: 14px; }
  ul.shoplist { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 30px; }
  @media (max-width: 640px) { ul.shoplist { columns: 1; } }
  ul.shoplist li { break-inside: avoid; padding: 7px 4px; border-bottom: 1px dashed var(--line); display: flex; align-items: baseline; gap: 8px; cursor: pointer; }
  ul.shoplist li.done .txt { text-decoration: line-through; color: var(--muted); }
  ul.shoplist .amt { min-width: 72px; font-weight: bold; color: var(--terra-dark); white-space: nowrap; }
  ul.shoplist .note { color: var(--muted); font-style: italic; font-size: 0.9em; }
  ul.shoplist input[type="checkbox"] { accent-color: var(--terra); }
  .shopbtns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  @media print {
    header.site, .controls, .back, .portions, .printbtn, footer.site, .count, .planner-grid, .shopbtns { display: none !important; }
    body { background: #fff; }
    .recipe, .shop { border: none; padding: 0; }
    .cols { grid-template-columns: minmax(180px, 300px) 1fr; }
  }
</style>
</head>
<body>
<header class="site">
  <h1>Receptenboek</h1>
  <p>Maaltijden en gebak, met aanpasbare hoeveelheden</p>
  <nav class="mainnav">
    <button class="navbtn" id="nav-recipes">Recepten</button>
    <button class="navbtn" id="nav-planner">Weekplanner</button>
  </nav>
</header>
<div class="wrap">
  <div id="app"></div>
</div>
<footer class="site">153 recepten &middot; gebaseerd op het familiekookboek</footer>
<script>
const RECIPES = [  {    "t": "Andijvie Stamppot",    "p": 3,    "i": [      "- 1300 g Aardappels",      "- 400 g Andijvie",      "- 100 g Spekjes, gerookt Gerookte, van de slager"    ],    "s": [      "",      "  - Melk",      "  - Zout",      "  - Peper",      "  - Nootmuskaat",      "",      "Kook de aardappels met wat zout gaar in 20 min. Bak de spekjes uit. Snijd de andijvie in reepjes, was hem en laat het goed uitlekken. Stamp de gekookte aardappels tot een puree met de (warme) melk en een beetje vet van de spekjes (of boter). Neem de andijvie en stamp dit (ons voor ons) samen met nootmuskaat en peper door de puree. Laat de andijvie nog iets op laag vuur garen en doe als laatste de spekjes bij de stamppot.",      ""    ]  },  {    "t": "Asperges",    "p": 3,    "i": [      "- 1,3 kg Asperges 20 stuks",      "- 1 kg Aardappels Malta of bintje",      "- 10 st Eieren gekookt",      "- 300 g Achterham iets dikker gesneden",      "- 125 g Roomboter"    ],    "s": [      "",      "",      "Bewaar de asperges tot gebruik in een vochtige theedoek onderin de koelkast.",      "",      "Serveerschaal voorverwarmen (kokend water of in oven).",      "",      "Eieren en ham in grove stukken verkruimelen",      "",      "Asperges echt goed schillen.",      "",      "Asperges in hoge pan, kopjes boven het water uit laten steken (vooraf meten met koud water en asperges).",      "",      "Water aan de kook brengen (gebruik ook snelkoker), asperges toevoegen, wekker op 20 min en opnieuw laten koken (duurt weer lang).",      "",      "Kookt weer op 12 min, op 1 min wel klaar => vuur uit. Als ze nog net slap hangen zijn ze goed.",      "",      "Boter zacht laten smelten in een pannetje (GEEN magnetron). De ham verwarmen in de magnetron (2x 30 seconden).",      ""    ]  },  {    "t": "BBQ recepten",    "p": 3,    "i": [      "- 4 st Hamburger unox",      "- 10 st Knakworstjes kleine",      "- 1 - Stokbrood",      "- 2 - Saus sate en cocktail",      "- 500 g Wortels peen",      "- 1 st Komkommer",      "- 2 st Paprika"    ],    "s": [      "",      "  - Mozzerela",      "",      "Stokbrood, cocktail, satesaus, mayo",      "",      "4 unox Hamburgers (dubbeldekkers)",      "",      "10 kleine Knakworst",      "",      "Serveren met wortelsalade.",      "",      "14 spiesjes halen bij de slager. (4 gamba, 3 speklap op stok, 4 worstjes, 3 andere)",      ""    ]  },  {    "t": "Bloemkoolpotje Mien",    "p": 3,    "i": [      "- 200 g Gehakt, half-om-half vegetarisch!",      "- 1 st Prei",      "- 1 st Bloemkool kleintje of uit de",      "- 1/2 l Champignons soep",      "- 2 st Knoflook",      "- 600 g Aardappels"    ],    "s": [      "",      "",      "Kook de aardappels en stamp ze tot een pureen met zout/peper en nootmuskaat. Bloemkool in kleine roosjes verdelen. Bak het gehakt rul in de pan. Doe de knoflook erbij. Bloemkool 2-3 minuten meebakken, daarna deksel op de pan en 10 minuten zacht laten stoven met een scheutje water (regelmatig omscheppen). Daarna de prei in halve ringen snijden en extra 5 minuten meestoven. Champignonsaus toevoegen en goed laten doorwarmen.",      "",      "Serveren met de aardappel puree.",      ""    ]  },  {    "t": "Boerenkool",    "p": 3,    "i": [      "- 725 g Boerenkool 500 gesneden, 225 diepvries",      "- 1500 g Aardappels",      "- 400 g Rookworst"    ],    "s": [      "",      "  - Peper",      "  - Zout",      "  - Nootmuskaat",      "  - Boter",      "",      "Schil de aardappels, snij de boerenkool in kleine stukken",      "",      "Kook de aardappels en de boerenkool 20 minuten",      "",      "Stamp alles fijn en maak de stamppot verder aan met de specerijen, melk, boter, jus, mosterd ect.",      "",      "Serveren met rookworst.",      ""    ]  },  {    "t": "Bonen patties",    "p": 3,    "i": [      "- 260 g Zwarte Bonen uitlekgewicht",      "- 1 st Ui grote",      "- 2 st Knoflook",      "- 800 g Aardappels",      "- 1 kg Groenten naar keuze"    ],    "s": [      "",      "  - Bloem",      "  - Kerriepoeder",      "  - Zout",      "  - Peper",      "",      "Snij de ui in kwart ringen en fruit. Op het laatst de knoflook en wat kerriepoeder erbij. Prak intussen de uitgelekte en afgespoelde bonen in een grote glazen schaal, en doe hier 2 el bloem en wat zout en peper bij. Meng het bij elkaar en maak er 5 patty's van doe je in bloem wentelt. Bak ze in niet meer dan 10 minuten in olie (teveel wordt te vet).",      "",      "Serveren met aardappelen en groente",      ""    ]  },  {    "t": "BPP met venkelsalade",    "p": 3,    "i": [      "- 500 g Pastinaak",      "- 250 ml Slagroom",      "- 400 ml Bouillonblokje kip",      "- 250 g Pasta spaghetti",      "- 3 st Knoflook",      "- 1 el Citroen sap"    ],    "s": [      "",      "  - Geraspte Kaas parmesaan",      "  - Peterselie handje",      "  - Peper",      "",      "Maak de venkel salade, kook 400 ml water.",      "",      "Schil en snij de pastinaak in korte 1 cm dikke frietjes.",      "",      "Fruit de knoflook heel kort, blus met slagroom en kokend water (niet alles).",      "",      "Voeg de gehalveerde spaghetti toe en laat 15 min indikken; na 5 min de pastinaak erbij.",      "",      "Dan citroensap toevoegen, en eventueel kokend water toevoegen aan het eind als een risotto.",      "",      "Op het eind de gehakte peterselie toevoegen.",      "",      "Serveren met parmesaanse kaas.",      "",      ""    ]  },  {    "t": "Broccoli spaghetti",    "p": 4,    "i": [      "- Zout",      "- Olie",      "- Basilicum",      "- Oregano"    ],    "s": [      "",      "500 g Broccoli",      "1 st Ui",      "2 st Gepelde Tomaten",      "333 g Pasta spaghetti",      "1/2 st Bouillonblokje",      "1/8 tl Ve-Tsin",      "Snipper en fruit de ui (4 min). Snij de broccoli in kleine roosjes. Dan tomaten met sap toevoegen en in stukjes knijpen. Voeg de broccoli, een scheut balsamico azijn, 1/2 bouillon blokje, 1/8 tl ve-tsin en een theelepel suiker toe. Laat in 20 min indikken",      "Voeg basilicum en oregano naar smaa ika mee.",      "",      "Voeg de tomaten met sap toe en ook de kruiden, goed mixen.",      "",      "Voeg op 't laatst de bonen en de mais toe en laat alles lekker warm sudderen.",      ""    ]  },  {    "t": "Chili Mie",    "p": 4,    "i": [      "- Peper",      "- Zout"    ],    "s": [      "",      "400 g Eiermie 1,33 pak",      "1 st Paprika rood",      "1 st Courgette",      "2 st Prei of ui",      "200 g Kaas in blokjes",      "2 st Knoflook",      "4 el Sweet Chili sauce",      "",      "Kook ruim water voor de eiermie. Snij de kaas, courgette en paprika in kleine blokjes. Bereid de eiermie zoals op de verpakking staat. Verhit olie in een wok heel heet. In drie minuten de groenten wokken, in de volgorde: de paprika, daarna de knoflook uit de knijper, daarna de courgette erbij. Voeg de chili sauce toe, zout en peper naar smaak. Schep op het laatst de kaas erbij en serveer met de mie.",      ""    ]  },  {    "t": "Chinese kool stamppot met slavinken",    "p": 4,    "i": [      "- Zout",      "- Peper",      "- Nootmuskaat"    ],    "s": [      "",      "1 st Chinese kool",      "1000 g Aardappels voor puree",      "4 st Slavinken",      "1 el Paprikapoeder",      "",      "Wrijf de slavinken in met paprikapoeder. Bak de vinken in 20 minuten langzaam gaar. Was de Chinese kool en snij in reepjes.",      "",      "Maak intussen aardappelpuree volgens de gebruiksaanwijzing. Schep de kool, en de rest van de boter erdoor en warm de stamppot goed door. Breng op smaak met zout, peper en een snufjes nootmuskaat. Schep de stamppot op 2 borden en leg de slavinken erop. Geef de jus erbij.",      ""    ]  },  {    "t": "CHV pasta",    "p": 4,    "i": [      "- Geraspte Kaas parmezaan",      "- Oregano"    ],    "s": [      "",      "1 st Venkelknol",      "400 g Champignons",      "1 st Courgette",      "330 g Pasta Han vind het minder lekker",      "1 st Ui",      "125 ml Crème Fraîche",      "1 el Miso witte",      "",      "Fruit de gesnipperde ui met de gedroogde oreg el.",      ""    ]  },  {    "t": "Han Snijboon",    "p": 8,    "i": [      "|  4 | st | Saucijs | Runder  |",      "|  500 | g | Snijbonen |   |",      "|  125 | g | Spekreepjes |   |",      "|  700 | g | Aardappels |   |",      "|  1 | st | Ui |   |",      "|   | - | Peterselie |   |",      "|   | - | Zout |   |",      "|   | - | Peper |   |",      "|   | - | Olie | zonnebloem  |"    ],    "s": [      "",      "",      "Schil de aardappels snij in kleine stukjes, maak in 5 minuten beetgaar met een beetje water in magnetron. Was de snijbonen en snij in ruitjes. Snipper de ui. Verhit olie in stoofpan, bak daarin 5 minuten de saucijzen. Haal de saucijzen eruit, en bak in dezelfde olie de spekjes uit met wat peper. Op het laatst ook de gesnipperde ui erbij. Voeg de snijbonen toe en leg de saucijzen er bovenop. Voeg 80 ml water toe, en laat met een deksel op de pan 10 minuten stoven. Bak in een andere pan in 8 minuten de aardappels op, met een beetje zout. Voor serveren de aardappeltjes met peterselie bestrooien.",      ""    ]  },  {    "t": "Hete bliksem",    "p": 8,    "i": [      "|  600 | g | Appels | Zoet (elstar)  |",      "|  500 | g | Appels | Zuur (Goudrenet)  |",      "|  1,1 | kg | Aardappels |   |",      "|  250 | g | Rookspek | 2 plak ontbijtspek van 1 cm (vooraf  |",      "|  1/4 | tl | Kruidnagels | gemalen  |",      "|  1/2 | tl | Kaneel | mespuntje  |",      "|  1/4 | tl | Zout |   |",      "|   | - | Peper |   |",      "|  50 | g | Boter | of oude jus  |"    ],    "s": [      "",      "",      "Voor Annemieke apart aardappels en bonen.",      "",      "Schil de appels, verwijder het klokhuis en snijd ze in 4 stukken.",      "",      "Doe de aardappelen in een grote pan en voeg zoveel water toe dat ze net onderstaan.",      "",      "Aardappels 20 min koken, na 10 min appels en spek erbij.",      "",      "Giet het kookvocht van het aardappelgerecht af, neem het spek uit de pan en snijd het in blokjes.",      "",      "Meng de kruidnagel, zout en kaneel erdoor.",      "",      "Stamp de aardappelen en appels door elkaar en maak er met de kruiden en de boter (jus) een smeuïge stamppot van (met zout en peper)",      "",      "Schep het spek erdoor en serveer de hete bliksem direct.",      "",      ""    ]  },  {    "t": "Hutspot",    "p": 9,    "i": [      "|  400 | g | Ui  |",      "|  600 | g | Wortels  |",      "|  1300 | g | Aardappels  |",      "|  200 | g | Aangedroogde worst en een saucijs  |",      "|   |  | - Zout  |",      "|   |  | - Peper  |",      "|   |  | - Boter  |",      "|   |  | - Melk  |",      "|  1 | tl | Mosterd  |"    ],    "s": [      "",      "",      "Schil de aardappels, snij de wortel in fijne en de ui in grove stukken.",      "",      "Kook de aardappels, wortel en ui 20 minuten",      "",      "Stamp alles fijn en maak de stamppot verder aan met de specerijen, melk, boter, jus, mosterd ect.",      "",      "Serveren met aangedroogde worst (of gewoon fijne worst).",      ""    ]  },  {    "t": "Kaasfondue",    "p": 9,    "i": [      "|  1 | st | Knoflook  |",      "|  3 | tl | Maizena  |",      "|  125 | ml | Kippenbouillon  |",      "|  125 | ml | Melk of witte wijn  |",      "|  450 | g | Geraspte Kaas jong belegen  |",      "|  150 | g | Geraspte Kaas Parmasan  |",      "|  1 | st | Stokbrood in blokjes  |",      "|  1 | st | Broccoli roosjes in 4 min beetgaar  |",      "|  200 | g | Schouderham 1 dikke plak, standje 8 (vooraf  |",      "|  200 | g | Aardappels blokjes, in 4 min beetgaar  |",      "|  250 | g | Champignons in helften, eerst onder gril  |",      "|  1 | st | Paprika  |",      "|   |  | - Peper  |",      "|   |  | - Bloem  |"    ],    "s": [      "",      "",      "Caquelon voor gebruik 2 uur in koud water zetten.",      "",      "In aparte pan op het vuur de melk met maizena en bouillon verwarmen, en de geraspte kaas erin smelten. (Kaas mag niet koken, alleen smelten).",      "",      "Knoflook teen in twee helften, en caquelon mee insmeren.",      "",      "Eventueel erin laten. Kaasmengsel overgieten in de caquelon en serveren.",      "",      "Champs in helften (ze krimpen) 16 min onder gril.",      ""    ]  },  {    "t": "Kerriebonen",    "p": 9,    "i": [      "|  300 | g | Kippedijen  |",      "|  1 | st | Lenteui  |",      "|  1 | tl | Kerriepoeder  |",      "|  750 | g | Witte bonen uitlekgewicht, een kleine en een  |",      "|  250 | ml | Kokosmelk schudden!  |",      "|  1 | st | Ui  |",      "|   |  | - Zout  |",      "|   |  | - Peper  |"    ],    "s": [      "",      "",      "Snij de kip in niet te kleine stukken, bak deze goed aan, en leg apart.",      "",      "Spoel de witte bonen af en laat ze goed uitlekken.",      "",      "Snipper en fruit de ui, later met de kerrie erbij en de harde stukken van de bosui.",      "",      "Schep de bonen, de kip en de kokosmelk erdoor.",      "",      "Snipper de bosui en voeg dit ook toe, goed doorwarmen.",      ""    ]  },  {    "t": "Kip Bianca",    "p": 9,    "i": [      "|  2 | st | Rijst  |",      "|  300 | g | Kipfilet  |",      "|  1 | st | Prei of ui  |",      "|  400 | g | Sperziebonen  |",      "|  100 | g | Cashewnoten  |",      "|  3 | el | Ketjap Manis  |",      "|  1/2 | tl | Ketoembar gemalen koriander  |",      "|   |  | - Olie olijf  |"    ],    "s": [      "",      "",      "",      "Snijd de kipfilet in repen. Schep ketjap manis en ketoembar erdoor en laat",      "",      "ca. 10 minuten marineren.",      "",      "Maak de prei schoon, snijd hem in smalle ringetjes, was ze en laat ze",      "",      "uitlekken. Haal de sperzieboontjes af en breek ze. Kook de sperzieboontjes",      "",      "in weinig kokend water in ca. 10 minuten beetgaar. Giet ze af.",      "",      "Verwarm de",      "",      "boter in de hapjespan. Bak hierin de kipfiletreeepjes ca. 4 minuten. Voeg de",      "",      "prei toe en bak ca. 2 minuten mee. Voeg de sperzieboontjes toe en warm het",      "",      "gerecht door. Voeg vlak voor het serveren de cashewnoten toe.",      "",      "Serveer dit met witte rijst.",      ""    ]  },  {    "t": "Kip madras",    "p": 9,    "i": [      "|  2 | el | Kerriepoeder | Verstegen kip madras  |",      "|  200 | g | Rijst |   |",      "|  3 | st | Kippedijen |   |",      "|  1 | st | Bloemkool |   |",      "|  250 | g | Sugarsnaps |   |",      "|  200 | ml | Kokosmelk |   |",      "|  1 | st | Gepelde Tomaten |   |"    ],    "s": [      "",      "",      "Kook rijst. Snij kipfilet en marineer in madras en 2 el olie. Snij bloemkool in kleine roosjes en kook 3 min. Bak de kip op hoog vuur bruin, voeg de bloemkool, sugarsnaps, kokosmelk en tomaten toe en laat 8 min zachtjes koken.",      ""    ]  },  {    "t": "Kip Tandoori",    "p": 9,    "i": [      "|  250 | g | Rijst  |",      "|  300 | g | Kipfilet  |",      "|  4 | tl | Tandoori kruiden  |",      "|  1 | st | Paprika rood  |",      "|  200 | g | Champignons  |",      "|  2 | st | Gepelde Tomaten  |",      "|  1 | st | Ui groot  |",      "|  10 | st | Papadums  |",      "|  125 | ml | Crème Fraîche  |",      "|  1 | st | Knoflook  |",      "|  2 | el | Sojasaus  |",      "|  2 | el | Olie  |"    ],    "s": [      "",      "",      "Snij de kipfilet in stukjes, en doe deze in een marinade met de tandoori kruiden, stukjes tomaat (eerst uitlekken), gesnipperde ui, olie, sojasaus en knoflook. Hoe langer je dit in de marinade laat staan, hoe lekkerder het wordt.",      "",      "Maak de rijst klaar.",      "",      "Maak de champignons schoon en snij deze net als de paprika in stukken. Bak de champignons en paprika echt goed aan.",      "",      "Bak dan de gemarineerde kip daarbij bruin. Op het eind de creme fraiche erbij, laat nog 5 minuten pruttelen.",      "",      "Serveren met rijst en papadums.",      "",      ""    ]  },  {    "t": "Komkommer salade",    "p": 10,    "i": [      "- Olie",      "- Azijn",      "- Peper"    ],    "s": [      "",      "1 st Komkommer",      "",      "Komkommer schillen en in plakjes snijden.",      "",      "Bestrooi met zout en laat 30 minuten uitlekken.",      "",      "Spoel ze af, doe in een kom.",      "",      "Voeg 1.5 el azijn en 1.5 el olie toe, met wat witte peper.",      "",      "Laat tot een dag in de koelkast staan.",      ""    ]  },  {    "t": "Koolsla",    "p": 10,    "i": [      "- Peper"    ],    "s": [      "",      "1/4 st Witte kool",      "1/2 st Appels",      "1 el Mayonaise",      "1 el Yoghurt",      "1 el Citroen sap",      "40 g Rozijnen",      "",      "Kool in heel dunne reepjes snijden, en in vergiet met 1,5L kokend water overgieten. Dan ook de appels in heel dunne reepjes snijden. Mayo, peper en citroensap mixen en als dressing door de salade. Toevoegen met de appel en de rozijnen.",      ""    ]  },  {    "t": "Koolsla Ramon Brugman",    "p": 10,    "i": [      "- Zout",      "- Peper"    ],    "s": [      "",      "side dish",      "",      "280 g Witte kool 1/4 kool",      "4 el Azijn",      "3 el Yoghurt",      "1/2 st Bieslook half bosje",      "1 1/2 el Suiker",      "",      "Doe de gesneden kool in een kom. Voeg de azijn, suiker en wat zout toe. Masseer de kool en laat het 10 minuten staan. Voeg dan de yoghurt toe en snijd de bieslook fijn. Roer alles goed door elkaar, en laat 30 minuten laat staan. Roer het om voor je het serveert.",      ""    ]  },  {    "t": "Koude Kip salade",    "p": 10,    "i": [],    "s": [      "",      "300 g Gerookte kipfilet",      "400 g Wortels",      "1/2 l Perzik uit blik",      "250 g Kerstomaatjes",      "250 g Pasta fusili",      "",      "Snij de wortels in halve schijfjes. Kook de pasta 5 min. Doe de wortels erbij, breng opnieuw aan de kook en kook nog eens 3 min extra.",      "",      "Snij de kerstomaatjes half door., de kipfilet en de uitgelekte perziken in stukken. Meng alles samen.",      "",      "Maak een dressing van 2 delen olie, 1 deel balsamico azijn, tijm basilicum en een eetlepel perzik sap.",      "",      "Eventueel serveren met geroosterde pijnboompitten",      ""    ]  },  {    "t": "Koude pasta salade",    "p": 10,    "i": [      "- Rozemarijn"    ],    "s": [      "",      "200 g Salamiplakken",      "400 g Broccoli",      "4 st Eieren gekookt, of feta kaas met olijven",      "",      "4 st Tomaten",      "1 tl Mosterd",      "2 el Olie Olijf",      "2 tl Azijn Wijnazijn",      "200 g Pasta fusili",      "",      "Bereiding (liefst 1 dag van tevoren):",      "",      "Meng de olijfolie, wijnazijn, mosterd en rozemarijn met elkaar en laat dit minstens een uur staan.",      "",      "Kook de pasta volgens de gebruiksaanwijzing. Kook de broccoli gaar (niet te). Snij de salami worst, de tomaten en de feta kaas (of eieren) kleine stukjes. Verdeel de olijven in vieren. Meng alle bestandsdelen met elkaar in een grote schaal. Laat dit enkele uren in de koelkast afkoelen.",      ""    ]  },  {    "t": "Lasagna - trad.",    "p": 10,    "i": [      "- Oregano",      "- Basilicum 2 takjes verse",      "- Melk",      "- Peper",      "- Zout"    ],    "s": [      "",      "16 st Lasagna vellen",      "250 g Gehakt, runder",      "3 st Gepelde Tomaten",      "210 g Tomaten puree",      "1 st Ui een grote",      "2 st Knoflook",      "10 st Kaas 20 plakken, ongeveer 1 ons",      "1 1/2 tl Paprikapoeder",      "2 st Laurierblaadjes eentje",      "1/2 tl Sambal",      "3 tl Suiker",      "6 el Olie",      "6 el Bloem",      "",      "Bolognesesaus:",      "",      "Ui en knoflook snipperen en in een grote koekenpan met wat olijfolie fruiten. In de kleine braadpan de tomatenpuree hard verwarmen (blijf roeren, anders brandt ze aan), tot deze niet zurig meer ruikt. Het ui/knoflook/olie mengsel toevoegen.",      "",      "Kruid de gehakt met zout, peper en paprika poeder. In de grote koekenpan weer wat olijfolie verwarmen en het gehakt rullen. Daarbij het tomatenpureemengsel doen, met de gepelde tomaten en op smaak brengen met de sambal, suiker, basilicum, oregano en een laurierblaadje toevoegen.",      "",      "1/2 uur op laag vuur laten sudderen, af en toe roeren.",      "",      "Ondertussen de oven voorverwarmen op 190 gr. C.",      "",      "Bechamelsaus:",      "",      "Boter of olie smelten (niet bruin laten worden), bloem erdoor roeren en verwarmen, melk toevoegen tot je een lobbige saus hebt. Op smaak brengen met zout en peper.",      "",      "In de schaal:",      "",      "1/3 tomatensaus, vellen, 1/3 bechamel, plakken kaas en dat drie keer.",      "",      "Afdekken met aluminium-folie en in de oven. Na 30 min. de folie verwijderen en nog 15 min. in de oven laten. Als het \"knettert\" is het klaar.",      "",      ""    ]  },  {    "t": "Lasagna groenten",    "p": 11,    "i": [      "|  1 | st | Courgette |   |",      "|  1 | st | Aubergine |   |",      "|  2 | st | Ui |   |",      "|  1 | st | Knoflook |   |",      "|   |  | - Oregano |   |",      "|   |  | - Basilicum |   |",      "|  3 | st | Gepelde Tomaten |   |",      "|  400 | g | Spinazie | verse  |",      "|  250 | g | Mozzerella |   |",      "|  200 | g | Geraspte Kaas | parmezaan en gewoon  |",      "|  15 | st | Lasagna | bladen  |"    ],    "s": [      "",      "",      "Verwarm oven voor op 210 graden. Snipper en fruit de ui in een pan, voeg tomaten toe en laat tot 20 min sudderen. Snijd de courgette en de aubergine in ronde plakken van ca. 2 milimeter, en leg ze op een rooster op bakpapier. Verhit wat olie in een koekenpan en bak hierin de spinazie 5 min. tot het geslonken is. Laat uitlekken in een vergiet. Meng wat olie met de kruiden en peper en zout, en besprenkel de plakken daarmee. Doe die de groenten 10 min in de oven, halverwege keren. Zet de oven daarna op 190 graden. Snijd de mozzarella in plakken en rasp de kaas grof. Bedek de schaal met een laagje tomatensaus en daarna met een laag van lasagnebladen. Leg hierop wat spinazie, courgette, aubergine, mozzarella, geraspte kaas en tomatensaus. Herhaal vier keer tot de ingrediënten op zijn. Eindig met tomatensaus en kaas. Bak de lasagne ca. 30 min. in het midden van de oven.",      ""    ]  },  {    "t": "Lauwe pasta salade",    "p": 11,    "i": [      "|  2 | st | Tonijn uit blik | op water  |",      "|  4 | st | Eieren | gekookt  |",      "|  400 | g | Sperziebonen |   |",      "|  1 | st | Paprika | rood  |",      "|  4 | st | Tomaten |   |",      "|  1 | st | Knoflook |   |",      "|  1/2 | tl | Suiker |   |",      "|  2 | el | Olie | olijf  |",      "|  1 | el | Azijn | wijn  |",      "|   |  | - Rozemarijn |   |",      "|  1 | tl | Mosterd |   |",      "|   |  | - Basilicum |   |",      "|  350 | g | Pasta | fusili  |"    ],    "s": [      "",      "",      "Meng de olijfolie, wijnazijn, mosterd, geperste knoflook, suiker en rozemarijn met elkaar en laat dit lekker lang staan (af en toe goed schudden). Kook de pasta volgens de gebruiksaanwijzing. Snij de boontje in stukjes en kook ze 7 minuten. Snij de tomaten, paprika en de eieren in stukjes. Laat de tonijn uitlekken. Meng alle bestandsdelen met elkaar in een grote schaal (vergeet het beetje basilicum niet).",      ""    ]  },  {    "t": "Lunch wraps",    "p": 11,    "i": [      "|  1 | st | Wraptortilla | een pak met 6 grote wraps  |",      "|  1 | st | Sla | 200 g  |",      "|  250 | g | Kerstomaatjes |   |",      "|  1 | st | Komkommer |   |",      "|  3 | st | Eieren | gekookt  |",      "|  125 | g | Boursin | of een andere roomkaas  |",      "|  1 | st | Tonijn uit blik | water  |",      "|  1/2 | st | Ui | zeer fijn gesnipperd  |",      "|  3 | st | Augurk |   |",      "|   |  | - Mayonaise |   |"    ],    "s": [      "",      "",      "",      "Maak 3 wraps met elk:",      "",      "bestrijk met 1/3 roomkaas",      "",      "1 ei in plakjes",      "",      "3 kerstomaatje door de helft",      "",      "1 augurk in lange plakjes",      "",      "2 blaadjes sla",      "",      "Maak nogmaals 3 wraps met elk:",      "",      "Tonijn",      "",      "Mayo erop",      "",      "1 theelepel zeer fijn gesnipperd ui",      "",      "4 plakjes komkommer",      "",      "3 kerstomaatje door de helft",      "",      "2 blaadjes sla",      "",      "vouwen/rollen en doormidden snijden",      ""    ]  },  {    "t": "Maaltijdsalade Bleke Appel",    "p": 11,    "i": [      "|  1/2 | - | Bleekselderij |   |",      "|  3 | st | Appels |   |",      "|  90 | g | Zongedroogde tomaten | half potje  |",      "|  1/2 | st | Sla | 1 ijsberg  |",      "|  5 | st | Eieren | gekookt  |",      "|  1 | st | Paprika | rode  |",      "|  1 | st | Ananas | klein blikje in stukjes  |",      "|  35 | g | Pijnboompitten |   |",      "|  2 | el | Yoghurt |   |",      "|  2 | el | Mayonaise |   |",      "|  2 | tl | Mosterd |   |",      "|  2 | tl | Kerriepoeder |   |"    ],    "s": [      "",      "",      "Alles bij elkaar!",      ""    ]  },  {    "t": "Maaltijdsalade Farmer Style",    "p": 11,    "i": [      "|  400 | g | Champignons |   |",      "|  1000 | g | Aardappels |   |",      "|  150 | g | Ontbijtspek |   |",      "|  1 | st | Sla |   |",      "|  6 | st | Boterhammen | Oude (dat snijd beter)  |",      "|   |  | - Olie |   |",      "|   |  | - Azijn |   |"    ],    "s": [      "",      "",      "Schil de aardappels en snij ze in blokjes, doe deze met een laagje water 10 min in de magnetron. Maak de champignons schoon en snij deze in plakjes. Snij de boterhammen in blokjes. Verdeel de sla over de borden, en doe hier een dressing overheen.. Bak in de eerste pan de boterhamblokjes in olijfolie tot croutons. Haal ze eruit, verdeel ze over de borden en bak daarna de aardappelblokjes in boter bruin op hoog vuur in 12 minuten. Bak in een tweede droge koekenpan het spek uit, verdeel dit ook over de borden. Bak in het restant spekvet de champignons. Verdeel de champignons en de aardappels over de borden en serveer.",      "",      ""    ]  },  {    "t": "Mac oven speciaal",    "p": 12,    "i": [      "|  500 g | Macaroni |   |",      "|  300 g | Schouderham | 3 mm dik (vooraf bestellen)  |",      "|  2 st | Paprika | groen  |",      "|  5 st | Tomaten |   |",      "|  250 g | Geraspte Kaas |   |",      "|   | - Zout |   |",      "|   | - Peper | witte  |",      "|   | - Paneermeel |   |",      "|   | - Boter |   |"    ],    "s": [      "",      "",      "Gebruik de grote pan! Kook de macaroni \"al dente\" met een snufje zout erdoor. Verwarm de oven voor op 200 °C. Snij de plakjes ham fijn, de paprika in dunne reepjes, de tomaten in plakjes en rasp eventueel de kaas. Vet de ovenschaal in. Giet de macaroni af en meng met de ham, de paprika en de helft van de kaas. Doe dat mengel in de ovenschaal. Leg de plakjes tomaat erover, strooi de rest van de kaas erover en dek het af met wat paneermeel. Verwarm in de oven tot de kaas gesmolten is (30 min.). Kaaskorst van Han=> Hendrik",      ""    ]  },  {    "t": "Melle's Kippensoep",    "p": 12,    "i": [      "|  1 st | Hele kip |   |",      "|  2 st | Kruidenbuideltje | voor kippensoep  |",      "|  300 g | Soepgroenten |   |",      "|   | - Stokbrood |   |",      "|   | - Kruidenboter |   |",      "|  3 st | Bouillonblokje | kippe-  |",      "|  4 st | Vermicelli | 4 handjes  |"    ],    "s": [      "",      "",      "Kip in de grote pan, 2,7 L water toevoegen, met kruidenbuideltjes 1,5 uur laten koken. Dan de buideltjes eruit. Kip eruit en het vlees eraf halen (elk botje verwijderen!) Kip stukken fijner snijden en terug in de pan. bouillonblokjes en groente erbij, 5 min koken, vermicelli erbij, weer 5 min koken, klaar! = 2x 1,7 L",      ""    ]  },  {    "t": "Mien's gevulde paprika's met bloemkool rijst",    "p": 12,    "i": [      "|  300 g | Gehakt, half-om-half |   |",      "|  3 st | Paprika |   |",      "|  3 st | Ui |   |",      "|  4 st | Tomaten |   |",      "|  800 g | Bloemkool | voor bloemkool rijst  |",      "|   | - Zout |   |",      "|   | - Peper |   |",      "|   | - Kerriepoeder |   |"    ],    "s": [      "",      "",      "Breng water aan de kook in een pannetje. Halveer de paprika's, verwijder de zaadlijsten en blancheert ze 60 seconden in het kokende water. Laat ze daarna uitlekken. Rul het enigszins gekruide gehakt, vul de paprika's daarmee en leg ze in de ovenschaal. Fruit de halve uien ringen in olie en kerrie. Tomaten in 8 stukken snijden, bestrooien met zout en witte peper en op de paprika's draperen. Daar bovenop de uien. Zet de schaal 30 minuten in de voorverwarmde oven bij 200°C. Bloemkool tot rijst hakselen en in brede pan in 10 min zacht bakkeb: voortdurend omscheppen.",      ""    ]  },  {    "t": "Mosselen",    "p": 12,    "i": [      "|  2 kg | Mosselen |   |",      "|  200 g | Soepgroenten | 2 uien, 1 winterwortel, 1 prei,  |",      "|  600 ml | Bier | 1 flesje  |",      "|  1 st | Saus | cocktailsaus  |",      "|  1 st | Komkommer |   |",      "|  1 kg | Aardappels |   |",      "- Vissticks"    ],    "s": [      "",      "",      "",      "Snij aardappel in blokjes en maak ze beetgaar in de magnetron, later op te bakken.",      "",      "Maak met de komkommer salade (ook in dit recepten boek) Mosselen goed onder koud stromend water afspoelen.",      "",      "Geopende mosselen met bolle kant tegen aanrecht tikken. Als mossel niet sluit, deze weggooien.",      "",      "In de mosselpan het bier gieten en de groenten 5 minuten koken (peper en zout naar smaak). Mosselen toevoegen en maximaal 5 minuten afgedekt koken tot alle schelpen open zijn. Tussentijds pan even goed omschudden.",      "",      "Serveer met cocktail saus en schijfjes komkommer.",      "",      "Serveer met het Belgisch bier of witte wijn (Pinot blanc).",      ""    ]  },  {    "t": "Nacho Groenten",    "p": 12,    "i": [      "|  400 g | Bruine bonen | netto gewicht  |",      "|  1 st | Prei |   |",      "|  500 g | Wortels | grof geraspt  |",      "|  100 g | Geraspte Kaas |   |",      "|  2 st | Nacho chips | 2 zakken van 175 gram, naturel  |",      "|  4 el | Mayonaise |   |",      "|  1 el | Mosterd |   |",      "|  2 el | Water |   |"    ],    "s": [      "",      "",      "Verwarm de oven voor op 200 graden.",      "",      "Bonen uitlekken en afspoelen. Prei in halve ringen en kort stoven. Wortels grof hakselen in de keukenmachine met het mes onderin. Kaas raspen. Dit alles mengen in de grootste ovenschaal en 10 in in de oven. Verdeel daarna de nacho's erover, en bedek met extra kaas. Overgebleven chips appart erbij serveren. Nogmaals 10 min in de oven op 200 graden. Meng het water, de mosterd en mayo voor de dip.",      ""    ]  },  {    "t": "Nasi",    "p": 12,    "i": [      "|  1 st | Nasi kruidenmix |   |",      "|  330 g | Rijst |   |",      "|  1 st | Groentepakket | of prei met ui  |",      "|  1 st | Saus | Sate  |",      "|  8 st | Eieren |   |",      "|  1 st | Prei |   |"    ],    "s": [      "",      ""    ]  },  {    "t": "Okonomiyaki",    "p": 12,    "i": [      "|  5 st | Eieren |   |",      "|  125 g | Zelfrijzend | nee, gewoon volk meel  |",      "|  1 tl | Bakpoeder | 7 g  |",      "|  2 el | Sojasaus |   |",      "|  700 g | Groenten | restjes: 1/4 kool, 1 wortel, 1  |",      "|  1 st | Bosui |   |",      "|   | - Olie |   |",      "|   | - Mayonaise |   |",      "|   | - Saus | half flesje BBQ saus  |",      "|   | - Gebakken uitjes |   |"    ],    "s": [      "",      "",      "Meng de meel met bakpoeder (grote rode kom), klop de sojasaus en eieren erin luchtig met een garde. Haksel de wortel, de harde stukken van de bosui en de 1/4 kool grof (keuken machine, mes onderin). Snij de prei in dunne halve ringen. Je kunt ook bleekselderij, paprika, doperwten, ui, etc. gebruiken. Voeg de groenten toe aan het beslag en meng zodat er geen vloeibaar beslag meer op de bodem aanwezig is.",      "",      "Schep 1/5 van het groenten mengsel in de koekenpan (gebruik meerdere als het kan), bak 5 min per kant op",      "",      "",      "medium tot laag vuur. Houd de koek warm in de oven (85 grad), en bak de volgende.",      "",      "Snij de rest van de bosui in ringen en serveer apart erbij. Op je bord de koek met strepen mayonaise en BBQ saus versieren (raster), en bestrooien met de gebakken uitjes en de bosui.",      "",      "Hendrik wil een halve; Annemieke en Henk 1 en een kwart.",      ""    ]  },  {    "t": "Pad Thai",    "p": 13,    "i": [      "|  15 | st | Vissticks  |",      "|  220 | g | Rijstnoodles  |",      "|  4 | st | Eieren  |",      "|  450 | g | Groentepakket nasi  |",      "|  1 | st | Paksoi  |",      "|  2 | el | Tamarindepasta  |",      "|  3 | el | Vissaus  |",      "|  1 | el | Azijn  |",      "|  1 | el | Honing  |",      "|  1 | el | Sojasaus  |"    ],    "s": [      "",      "",      "Borden voorverwarmen op 90 graden.",      "",      "Wel de rijstnoodles 4 min in heet water, afgieten (vergiet), afspoelen, scheutje olie, en wegzetten.",      "",      "Bak de visstick rustig in een pan met wat olie.",      "",      "Breng de tamarinde, vissaus, honing, azijn en sojasaus even aan de kook, en zet weg.",      "",      "Snij de paksoi, wok 3 min, zet appart (oven 90 graden).",      "",      "Roerbak de eieren met een beetje zout&peper, en doe bij de paksoi.",      "",      "Roerbak de nasi groenten 3 min, bak daarna de rijstnoodles mee, en maak af met de saus.",      "",      "Maak de borden op met de paksoi/ei, noodles/groente en de visstick.",      ""    ]  },  {    "t": "Pannenkoeken",    "p": 13,    "i": [      "|  600 | g | Pannenkoekenmix | meergranen  |",      "|  450 | g | Spinazie | diepvries, niet uitlekken  |",      "|  14 | st | Ontbijtspek | 14 plakken  |",      "|  3 | st | Eieren |   |",      "|  1100 | ml | Melk | 800+300  |",      "|  550 | ml | Water |   |",      "|   |  | - Olie |   |",      "|   |  | - Zout |   |"    ],    "s": [      "",      "",      "Zet schoteltjes op afzuigkap, ontdooi de spinazie (5 min magnetron). Voeg de helft van het water/melk bij de pannenkoek mix en de bloem, goed mixen. Voeg de 3 eieren, olie en zout toe => mixen. Doormixen en rest van het melk/water toevoegen. Als laatste de spinazie er bij mixen. Laat het een uur staan.",      ""    ]  },  {    "t": "Paprika roomsoep",    "p": 13,    "i": [  en bruine randjes hebben. Bak de pitten goudbruin.",      "",      "Zet de pasta op en kook volgens de verpakking gaar. Bak, terwijl de pasta kookt, de knoflook in olie glazig in een koekenpan. Zet het vuur laag en voeg de miso en ongeveer 150 ml pastawater toe en roer door elkaar tot een gladde saus. Breng op smaak met peper.",      "",      "Meng de groente, pasta, gsneden bieslook en misosaus door elkaar. Schep op borden. Garneer met Parmezaanse kaas.",      ""    ]  },  {    "t": "Pasta Bologlinzen",    "p": 13,    "i": [      "|  50 | g | Linzen | gedroogd  |",      "|  2 | st | Bleekselderij | 2 stengels  |",      "|  100 | g | Wortels |   |",      "|  250 | g | Champignons |   |",      "|  1 | st | Gepelde Tomaten | 4 ons  |",      "|  300 | g | Pasta | spaghetti  |",      "|  1 | st | Bouillonblokje |   |",      "|  1 | st | Ui |   |",      "|  2 | st | Knoflook |   |",      "|   |  | - Oregano |   |",      "|   |  | - Basilicum |   |",      "|   |  | - Peper |   |",      "|   |  | - Kaas | parmezaanse  |"    ],    "s": [      "",      "",      "140 g Tomaten puree",      "",      "Snij ui en groenten in stukken.",      "",      "Fruit ui en knoflook, en bak de wortel, bleekselderij en champignons kort mee.",      "",      "Voeg de tomaten, bouillonblokje en Ve-tsin toe, en laat 30 min sudderen. Na 10 minuten de linzen erbij. Voeg een beetje water toe indien het droogkookt.",      "",      "Kook de spaghetti 9 minuten.",      "",      "Laatste 5 min de oregano en basilicum toevoegen..",      "",      ""    ]  },  {    "t": "Pasta Carbonara met wortel rauwkost",    "p": 14,    "i": [      "|  300 g | Spekreepjes | eigenlijk panchetta  |",      "|  100 g | Geraspte Kaas | parmesan  |",      "|  100 g | Geraspte Kaas | gewoon  |",      "|  3 st | Knoflook |   |",      "|  8 st | Eieren |   |",      "|   | - Peper |   |",      "|  500 g | Wortels |   |",      "|  75 g | Rozijnen |   |",      "|  1 dl | Appelsap |   |",      "|  1 el | Citroen sap |   |",      "    "t": "Pasta kokossaus",    "p": 14,    "i": [      "|  425 g | Pasta |   |",      "|  400 g | Champignons |   |",      "|  1 1/2 st | Prei |   |",      "|  4 st | Boterhammen |   |",      "|  400 ml | Kokosmelk |   |",      "|  1 el | Miso |   |"    ],    "s": [      "",      "",      "Snij de champignons in plakjes en bak hard aan in olie. Snij de prei in halve ringen voeg pas toe als de champignons goed",      "",      "gebruik zijn. Daarna kokosmelk en miso toevoegen en in 10 min laten inkoken.",      "",      "Kook de pasta.",      "",      "Bak het brood tot croutons met zout en tuinkruiden.",      ""    ]  },  {    "t": "Pasta makreel met rucola",    "p": 14,    "i": [      "|  1 st | Makreel | gerookte  |",      "|  2 st | Gepelde Tomaten |   |",      "|  100 g | Sla | zakje rucola  |",      "|  1 st | Ui |   |",      "|  1 st | Knoflook |   |",      "|   | - Tuinkruiden |   |",      "|  425 g | Pasta |   |"    ],    "s": [      "",      "",      "Snipperde ui en pel de knoflook. De ui zachtjes bakken tot ze glazig ziet (5 min). Op het eind de knoflook erbij.",      "",      "Voeg de tomaten uit blik toe met de tuinkruiden en laat 15-20 minuten sudderen om in te dikken.",      "",      "Haal het vel van de makreel en verwijder alle graten.",      "",      "Kook de pasta 9 min.",      "",      "Als de saus klaar is, deze mengen met de makreel.",      "",      "Vervolgens de pasta erdoor scheppen en als laatste de rucola erdoor scheppen.",      "",      "Serveren met parmezaanse kaas.",      ""    ]  },  {    "t": "Pasta Prei Zalm",    "p": 14,    "i": [      "|  425 g | Zalm filet | blik  |",      "|  2 st | Prei |   |",      "|  1 st | Gepelde Tomaten |   |",      "|  125 ml | Zure room |   |",      "|  2 st | Knoflook |   |",      "|   | - Peper |   |",      "|   | - Zout |   |",      "|  2 el | Bloem |   |",      "|  125 ml | Melk |   |",      "|  1 el | Citroen sap |   |",      "|  375 g | Pasta |   |"    ],    "s": [      "",      "",      "Snij de prei in halve ringen, en smoor dit in een klein beetje olie zachtjes. Laat de zalm uitlekken, kook de pasta.",      "",      "Doe in een kom de bloem, citroensap, zure room en de melk en klop dit samen tot een mengsel. Pers de knoflook bij de prei, en laat dat nog even mee sudderen.",      "",      "Voeg het melk mengsel en de tomaat toe en laat dit langzaam opwarmen zodat de bloem gaar wordt. Haal de zalm los met een vork, en laat dit samen met de tomaten mee warmen in het mengsel. Breng op smaak met zout en peper (proeven!).",      ""    ]  },  {    "t": "Pasta vis",    "p": 14,    "i": [      "|  425 g | Pasta | penne  |",      "|  1 st | Ui |   |",      "|  2 st | Knoflook |   |",      "|   | - Olie |   |",      "|  45 g | Ansjovis |   |",      "|  250 g | Makreel | 2 blikjes  |",      "|  2 st | Gepelde Tomaten |   |",      "|  250 g | Kerstomaatjes |   |",      "|   | - Basilicum |   |"    ],    "s": [      "",      "",      "Laat ansjovis en makreel uitlekken. Gebruik een gedeelte van de olie om in te bakken. Fruit de ui, de knoflook en de fijngehakt ansjovis. Gepelde tomaten erbij, stuk hakken en 20 min laten pruttelen. Kook de pasta, halveer de kerstomaten.",      "",      "Laatste 5 min: basilicum, makreel en kers tomaten erdoor.",      "",      "Proef en breng op smaak met peper.",      "",      ""    ]  },  {    "t": "Pasta Zalm Spinazie",    "p": 15,    "i": [      "- Peper"    ],    "s": [      "",      "125 ml Witte wijn of rose",      "200 ml Slagroom",      "200 g Zalm, gerookt",      "diepvries, blad",      "750 g Geraspte Kaas",      "425 g Pasta",      "5 st Eieren gekookt",      "",      "Kook en pel 5 eieren. Laat de spinazie ontdooien (8 min magnetron). Snij de zalm in stukjes en bestrooi met peper.",      "",      "Kook de pasta. Breng de wijn en de room aan de kook, en laat het 5 min indikken. Voeg zalm en spinazie toe aan de het room mengsel, nog 5 min doorwarmen. Serveer met geraspte kaas.",      ""    ]  },  {    "t": "Pizza-om",    "p": 15,    "i": [      "- Oregano",      "- Basilicum",      "- Azijn balsamico",      "- Zout",      "- Peper",      "- Olie"    ],    "s": [      "",      "1 st Ui rode",      "2 st Paprika geel",      "1 st Courgette",      "250 g Champignons",      "250 g Tomaten kers",      "270 g Bladerdeeg een rol",      "125 g Mozzerela buffel",      "75 g Geraspte Kaas of plakken?",      "600 g Wortels peen voor wortelsalade",      "",      "Totale tijd: 1h45min",      "",      "Pel ui in snij in kwarten, laagjes los maken. snij de groenten in grove stukken. Meng dit in een braadslee met wat olie, zout peper en oregano. Doe 50 min in de oven op 180 graden (halverwege omscheppen).",      "",      "Schuif de groenten naar het midden, vet de randen van de braadslee in met wat olie. Leg het bladerdeeg er bovenop, de randjes een beetje instoppen. Terug 30 min in de oven.",      "",      "Maak voorzichtig de randen los, en keer de pizza op een plank, besprenkel met balsamico. Scheur de basilicum en mozzarella erover, de andere kaas aan 1 kant",      "",      "Serveren met wortel salade",      ""    ]  },  {    "t": "Pompoen soep",    "p": 15,    "i": [],    "s": [      "",      "1 st Pompoen 1,1 kilo pompoen, 888 g",      "1 st Venkelknol",      "1 st Knoflook",      "2 st Bouillonblokje",      "1 st Ui",      "125 ml Slagroom",      "1 tl Paprikapoeder",      "1 l Water",      "1 st Basilicum takje",      "st Laurierblaadjes",      "1/2 tl Gemberpoeder",      "",      "Hak de pompoen doormidden, verwijder de pitten en het draadjesvruchtvlees",      "",      "Snijd de pompoen in blokjes, versnipper de ui",      "",      "Breng water aan de kook. Fruit de knoflook met de ui in de soeppan. Voeg de pompoen, 1250 ml kokend water en de groentebouillontabletten toe",      "",      "laat de soep 15 min koken, tot de pompoen zacht is.",      "",      "Snij de venkel in dunne reepjes en maak deze beetgaar in de magnetron (4 min).",      "",      "Voeg de kookroom, de fijngesneden basilicum en de paprikapoeder toe en pureer de soep met de staafmixer, Meng daarna de venkel erdoor.",      "",      "Serveer met Parmezaanse kaas en uienstokbrood.",      ""    ]  },  {    "t": "Prei makreel stamp",    "p": 15,    "i": [      "- Mosterd",      "- Zout",      "- Peper",      "- Nootmuskaat"    ],    "s": [      "",      "1200 g Aardappels",      "2 1/2 st Prei",      "1 st Makreel",      "3 st Knoflook",      "",      "Kook de aardappelen in 20 minuten gaar. Snijd en bak de prei samen met knoflook zachtjes in de wok. Maak de makreel schoon en snij in stukken, voeg bij de prei om op te warmen met zout, peper en nootmuskaat. Stamp de aardappelen tot een puree en schep de prei met makreel erdoor.",      "",      "Serveer met mosterd",      ""    ]  },  {    "t": "Quiche deeg",    "p": 15,    "i": [],    "s": [      "",      "1 st Eieren",      "200 g Bloem (kl.vorm 145)",      "100 g Boter (kl.vorm 73)",      "80 ml Water beetje bij beetje",      "",      "Doe de bloem in een kom maak een kuiltje in het midden en doe het eigeel, de zacht gemaakte boter en de helft van het water (eiwit kun je bewaren voor de vulling van de quiche). Mix alles met de toppen van de vingers of met een houten lepel. Zorg er voor dat het deel alles goed egaal opneemt.",      "",      "Maak dan van het deeg een platte bol en laat deze twee uren koel rusten.",      "",      "Hierna, strooi bloem over de aanrecht en rol het deeg met een roller of fles uit. Vouw het deeg in tweeën om het gemakkelijk in een beboterde ronde bakschaal te leggen.",      ""    ]  },  {    "t": "Quiche Lorraine spek/champs",    "p": 15,    "i": [],    "s": [      "",      "125 g Spekreepjes",      "400 g Champignons grote bak",      "4 st Eieren",      "125 ml Crème Fraiche",      "100 g Geraspte Kaas Gruyere",      "2 el Melk",      "",      "Gebruik de kleine vorm. Maak een quiche deeg, en bak deze blind in 20 min op 190 graden (ook in dit boek).",      "",      "Bak de spekjes en later de champignons in plakjes er aat met deksel op de pan 10 min stoven.",      "",      "Kook de eieren. Snij broccoli in kleine roosjes, voeg na de 10 min toe samen met de erwten, en stoof nog eens 10 min (met deksel). Indien nodig nog wat kokend water toevoegen. Serveer met de gepelde halve eieren.",      ""    ]  },  {    "t": "Rijst koken",    "p": 17,    "i": [      "|  333 | g | Rijst  |",      "|  1 1/2 | l | Water  |"    ],    "s": [      "",      "",      "Kook het water in de water koker, en doe in een pan. Giet bij de zilvervlies rijst en laat 10 minuten koken. Dan afgieten en nog 10 min warm wegzetten 100g wordt 380 g, 260 g wordt 1000 g.",      ""    ]  },  {    "t": "Rijst Paksoi",    "p": 17,    "i": [      "|  200 | g | Rijst  |",      "|  2 | st | Paksoi of een chinese kool  |",      "|  2 | st | Knoflook  |",      "|  200 | g | Gehakt, half-om-half vegetarisch!  |",      "|  100 | g | Cashewnoten  |",      "|  1 | el | Ketjap Manis  |",      "|   | - | Zout  |",      "|   | - | Kurkuma  |"    ],    "s": [      "",      "",      "Kook de rijst gaar volgens de gebruiksaanwijzing op de verpakking. Was de paksoi en snij de groente in reepjes. Bak het gehakt rul en voeg daarna de knoflook toe. Bak de paksoi al omscheppend mee tot de groente is geslonken. Schep de ketjap, de cashewnoten en de rijst door het groentemengsel. Voeg naar smaak zout toe. De rijst kun je ook apart serveren.",      ""    ]  },  {    "t": "Rijst Xuezhen",    "p": 17,    "i": [      "|  6 | st | Eieren  |",      "|  3 | st | Gepelde Tomaten gepelde  |",      "|  2 | st | Knoflook  |",      "|  1 | st | Ui groot  |",      "|  200 | g | Rijst  |",      "|   | - | Lenteui  |",      "|  1 | el | Miso  |"    ],    "s": [      "",      "",      "Kook de rijst.",      "",      "Fruit de ui, op het laatst met de knoflook. Daarna de tomaten erbij, de miso en 20 min laten sudderen.",      "",      "Klop de eieren (eventueel met wat zout en peper) en laat langzaam stollen in een andere pan, pas laat doorroeren zodat je grotere stukken ei krijgt, maak af met een scheut sojasaus.",      "",      "Op het laatst de ei, de in ringen gesneden lenteui en de tomatensaus samenvoegen.",      ""    ]  },  {    "t": "Risotto paddestoel",    "p": 17,    "i": [      "|  500 | g | Champignons ook gekke soorten  |",      "|  250 | g | Risotto rijst  |",      "|  2 | st | Bouillonblokje voor 1 L bouillon  |",      "|  3 | st | Knoflook  |",      "|  30 | g | Pijnboompitten  |",      "|   | - | Geraspte Kaas Parmezaanse  |"    ],    "s": [      "",      "",      "Fruit kort de knoflook, en voeg de rijst toe tot ze glazig ziet. Maak voeg in 20 minuten de bouillon toe.",      "",      "In een andere pan de pijnboompitten goudbakken.",      "",      "In nog een andere pan de gesneden paddestoelen 15 min goed aanbraden.",      "",      "Serveren met parmezaanse kaas.",      ""    ]  },  {    "t": "Risotto Prei",    "p": 17,    "i": [      "|  250 | g | Risotto rijst  |",      "|  2 1/2 | st | Prei  |",      "|  2 | st | Bouillonblokje groenten bouillon  |",      "|  200 | ml | Slagroom  |",      "|   | - | Nacho chips  |",      "|   | - | Geraspte Kaas Parmasan  |",      "|   | - | Zout  |",      "|   | - | Peper  |",      "|  1 | l | Water voor de bouillon  |"    ],    "s": [      "",      "",      "De prei in dunne halve ringen snijden, 5 min smoren in de boter. De risotto rijst even mee sudderen zodat de korrels glazig worden. Dan de bouillon lepel voor lepel erbij totdat de rijst niets meer op neemt (duurt 20 min). Roer dan de room erdoor, voeg (zout en) peper naar smaak toe, en serveer met geraspte Parmezaanse kaas.",      ""    ]  },  {    "t": "Risotto venkel",    "p": 17,    "i": [      "|  1 | st | Venkelknol grote  |",      "|  300 | g | Worst verse, fijne  |",      "|  250 | g | Risotto rijst  |",      "|  1 | st | Ui  |",      "|  1 | l | Water  |",      "|  1 | el | Citroen sap  |",      "|   | - | Geraspte Kaas Parmezaan  |",      "|   | - | Peper  |",      "|  1/2 | st | Bouillonblokje kip  |",      "|  1/4 | l | Witte wijn  |"    ],    "s": [      "",      "",      "Snij venkel in kleine blokjes. Snipper de ui. Maak bouillon.",      "",      "Snij worst vel open, en bak het vlees hard aan goed in olie (moet zelfs een beetje knapperig worden). Venkel met ui 2-3 min goed meebakken. Risotto mee glazig maken, wijn en citroensap erbij, bouillon lepel voor lepel erbij (duurt 20 min). Daarna op smaak maken met peper en citroensap. Serveren met Parmezaanse kaas.",      ""    ]  },  {    "t": "Rode Linzensoep",    "p": 17,    "i": [      "|  275 | g | Linzen rode  |",      "|  250 | g | Wortels winterpeen  |",      "|  1 | st | Ui  |",      "|  4 | st | Knoflook  |",      "|  2 | st | Bouillonblokje  |",      "|  2 | st | Turks Brood  |",      "|  6 | st | Boterhammen  |",      "|  4 | tl | Paprikapoeder  |",      "|  4 | tl | Komijn, gemalen  |",      "|   | - | Peper  |",      "|  140 | g | Tomaten puree  |"    ],    "s": [      "",      "",      "",      "Snijd de wortel in plakjes en was de linzen",      "",      "Snijd de ui, knoflook en peper fijn",      "",      "Fruit de ui en knoflook in een grote soeppan met wat olie",      "Gooi hier de gesneden wortel en paprikapoeder bij en bak",      "voor een paar minuutjes",      "",      "Vervolgens doe je er 1300 ml water bij, samen met de",      "gewassen linzen en het blokje groentebouillon",      "",      "Laat alles voor ongeveer 45 minuten koken",      "",      "Hierna neem je een droge pan waarin je het komijnpoeder",      "bakt totdat je het goed gaat ruiken",      "",      "Hier voeg je een theelepeltje boter aan toe en als deze is",      "gesmolten de tomatenpuree",      "",      "Laat dit geheel even pruttelen",      "",      "Zet ondertussen de oven aan op 180 graden en leg het Turks",      "brood hierin voor zo'n 10 minuten (zelf even bijhouden, elke",      "oven is anders).",      "",      "Doe de inhoud van het pannetje met de tomatenpuree bij de",      "soep en pureer de soep met een staafmixer.",      ""    ]  },  {    "t": "Sardientjes pasta",    "p": 18,    "i": [      "|  3 | st | Sardientjes uit blik  |",      "|  2 | st | Paprika rood  |",      "|  2 | st | Gepelde Tomaten  |",      "|  1 | el | Kappertjes goed afgespoeld  |",      "|  1 | st | Knoflook  |",      "|   |  | - Basilicum  |",      "|   |  | - Zout  |",      "|   |  | - Peper  |",      "|  425 | g | Pasta  |"    ],    "s": [      "",      "",      "Kook de pasta. Doe een eetlepel sardientjes olie in de",      "koekenpan en bak daar de paprika in, en later de knoflook",      "erbij. Voeg de tomaten toe, kruid met peper, zout en 20 min",      "pruttelen, laatste 5 min de basilicum erbij en de bijtgrote",      "stukken sardientjes.",      "",      "Als de pasta klaar en afgegoten is, doe de saus bij de pasta,",      "goed mengen en dan serveren met kappertjes.",      ""    ]  },  {    "t": "Sate saus van pindakaas",    "p": 18,    "i": [      "|  1 | el | Pindakaas  |",      "|  3 | el | Melk  |",      "|  1 | tl | Ketjap Manis  |",      "|  1/2 | tl | Gemberpoeder  |",      "|  2 | tl | Citroen sap  |",      "|   |  | - Sambal mespuntje  |",      "|  1/4 | tl | Suiker  |"    ],    "s": [      "",      "",      "Dit is voor 1 persoon, in kleine koekenpan verwarmen en",      "mengen.",      ""    ]  },  {    "t": "Schorseneren",    "p": 18,    "i": [      "|  500 | g | Schorseneren  |",      "|  1500 | g | Aardappels  |",      "|  200 | g | Schouderham standje 2.5, drie plakken  |",      "|  100 | g | Geraspte Kaas  |",      "|   |  | - Nootmuskaat  |",      "|   |  | - Peper  |",      "|   |  | - Zout  |",      "|   |  | - Azijn  |",      "|   |  | - Olie  |",      "- Bloem"    ],    "s": [      "",      "",      "",      "Schorseneren enige tijd in water leggen. Daarna schillen met",      "een dun schiller onder water. Geschilde stukken meteen in",      "water met een scheur azijn zetten. Schorseneren hierin 25",      "min koken. Maak een bechamelsaus van 4 el olie, 4 el bloem",      "en melk tot je een gebonden saus hebt. Dan de geraspte kaas",      "en blokjes ham eraan toevoegen.",      "",      "Vet de ovenschaal in, schik daarin de stukken schorseneer en",      "bestrooi ze met de nootmuskaat en maal er wat peper over.",      "Doe de saus eroverheen. Zet de schotel 25 minuten in de",      "oven op 200 graden.",      "",      "Schil de aardappel en snij in schijfjes, maximaal 15 min in",      "magnetron om beetgaar te maken. Afbakken in de",      "koekenpan, 20 minuten.",      ""    ]  },  {    "t": "Selderij Steak met gebakken aardappels",    "p": 18,    "i": [      "|  1 | st | Knolselderij  |",      "|  1500 | g | Aardappels  |",      "|  1/4 | st | Witte kool  |",      "|  1/4 | tl | Zout  |",      "|  1 | tl | Paprikapoeder gerookte  |",      "|  1/2 | tl | Knoflook poeder  |",      "|  1 | tl | Tijm  |",      "|  1/4 | tl | Peper witte  |"    ],    "s": [      "",      "",      "Schil de aardappelen, snij in blokjes en doe 15 min in de",      "magnetron.",      "",      "Verwarm oven voor op 200 graden.",      "",      "Snij de knolselderij in 5 plakken van 1,5-2 cm (rest invriezen",      "voor bijv. erwtensoep). Snij de schil van de plakken af.",      "",      "Maak een mengsel van de kruiden (tijm, rozemarijn), olie (3",      "el), gerookte paprikapoeder, geperste knoflook, zout en",      "peper, en smeer de plakken daarmee aan beide kanten in.",      "Leg de plakken op een bakplaat in het midden van de oven,",      "en bak 40 min (halverwege omkeren).",      "",      "Bak de aardappels in 18 min goudbruin.",      "",      "Serveer met koolsla van Ramon.",      ""    ]  },  {    "t": "Snijbonen stamppot",    "p": 18,    "i": [      "|  1400 | g | Aardappels  |",      "|  800 | g | Snijbonen  |",      "|  75 | g | Cashewnoten  |",      "|  200 | g | Witte bonen uit blik Cannellini  |"    ],    "s": [      "",      "Blote billen in het gras",      "",      "",      "Schil de aardappels, en kook ze 20 minuten.",      "",      "Snij de punten van de snijbonen (controleer op draden), en",      "snij ze fijn (eventueel met keuken machine).",      "",      "Blancheer de snijbonen tot ze beetgaar zijn (heel fijn",      "gesneden 3 min tot minder fijn gesneden 8 minuten) (of 6",      "min met wat water in de magnetron).",      "",      "Doe de cashewnoten 8 minuten op 180 graden, of rooster ze",      "in een droge koekenpan.",      "",      "Spoel de witte bonen af onder de kraan.",      "",      "Pureer de aardappels, voeg zout, peper en nootmuskaat toe",      "en genoeg warme melk om het smeuig te maken. Schep de",      "snijbonen en witte bonen er doorheen. Serveer de",      "cashewnoten er apart bij.",      "",      ""    ]  },  {    "t": "Spaghetti Bolognese - lang",    "p": 19,    "i": [      "|  300 | g | Gehakt, runder |   |",      "|  1 | st | Wortels | een peen  |",      "|  1 | st | Bleekselderij | vijf stengels  |",      "|  2 | st | Gepelde Tomaten |   |",      "|  2 | st | Knoflook |   |",      "|  1 | st | Ui |   |",      "|  400 | ml | Rode wijn |   |",      "|  200 | ml | Bouillonblokje | runderbouillon  |",      "|  1 | tl | Suiker |   |",      "|   |  | - Peterselie |   |",      "|   |  | - Geraspte Kaas |   |",      "|  350 | g | Pasta | spaghetti  |",      "|   |  | - Komkommer |   |"    ],    "s": [      "",      "",      "Fruit ui, knoflook, wortel en bleekselderij in een grote pan. Bak daarna het gehakt erbij rul. Voeg wijn, bouillon, tomaat, suiker en peterselie toe en breng het aan de kook. Laat het op laag vuur 1.5 uur pruttelen, af en toe roeren. Voeg zout en peper naar smaak toe. Kook de spaghetti al dente, en serveer met geraspte kaas.",      ""    ]  },  {    "t": "Sperzie curry",    "p": 19,    "i": [      "|  500 | g | Sperziebonen |   |",      "|  1 | st | Gepelde Tomaten |   |",      "|  400 | ml | Kokosmelk |   |",      "|  200 | g | Rijst |   |",      "|  1 | st | Ui | ook gebakken uitjes  |",      "|  2 | st | Knoflook |   |",      "|  1 | el | Tamarindepasta |   |",      "|  1 | tl | Gemberpoeder | djahe  |",      "|  1 | tl | Komijn, gemalen |   |",      "|  1 | tl | Kurkuma |   |",      "|   |  | - Zout |   |",      "|   |  | - Gebakken uitjes |   |"    ],    "s": [      "",      "",      "Kook de rijst. Punt de sperziebonen.",      "",      "Fruit de ui en knoflook. De tamarindepasta, koriander, komijn, djahe en kurkuma 1 min meebakken.",      "",      "Blus met de tomaat en daarna de kokosmelk, voeg speriebonen toe, met beetje zout, laat 15 min sudderen. Serveren met gebakken uitjes.",      ""    ]  },  {    "t": "Spieks en Graans",    "p": 19,    "i": [      "|  1000 | g | Aardappels |   |",      "|  3 | st | Ui |   |",      "|  10 | st | Eieren |   |",      "|  200 | ml | Olie | olijf of zonnebloem  |",      "|   |  | - Zout |   |",      "|   |  | - Peper |   |"    ],    "s": [      "",      "a la manera de Ana Valero para dos personas",      "",      "",      "Schil aardappels, en snij in dunne plakken (3 mm). Snipper de uien.",      "",      "Verhit wok met olie (een redelijke hoeveelheid zodat de aardappels zo'n beetje onder staan). Doe de aardappels in de olie, bak 20 minuten, na 5 min het ui erbij.",      "",      "Laat daarna de inhoud van de pan uitlekken (in vergiet). Meng dit in een schaal met de eieren, zout, peper.",      "",      "Het mengsel terug in de pan op lager vuur om tot omelet te worden. Halverwege (7 min) m.b.v. een bord omkeren (pas op dat er geen olie op je arm komt!), en nog eens 5 min bakken.",      "",      "Serveren met griekse salade.",      ""    ]  },  {    "t": "Spinaziebollen met tomatensalade",    "p": 19,    "i": [      "|  14 | st | Bladerdeeg |   |",      "|  750 | g | Spinazie | diepvries (grote schaal ontdooien)  |",      "|  165 | g | Geraspte Kaas |   |",      "|  50 | g | Paneermeel |   |",      "|  6 | st | Eieren | 1 bol zonder ei  |",      "|   |  | - Zout |   |",      "|   |  | - Peper |   |",      "|   |  | - Nootmuskaat |   |",      "|  7 | st | Tomaten |   |",      "|  1/4 | st | Ui | zeer fijn gesnipperd  |",      "|   |  | - Olie | olijf, 3 delen  |",      "|   |  | - Azijn | balsamico, 1 deel  |",      "|   |  | - Tijm |   |",      "|   |  | - Basilicum | liefst verse  |",      "|  3 | tl | Suiker |   |"    ],    "s": [      "",      "",      "Kook de eieren hard (6 minuten), en pel ze. Ontdooi de plakjes bladerdeeg. Ontdooi de spinazie, en druk het meeste vocht eruit in een zeef met een lepel. Meng het met de kaas en de paneermeel, nootmuskaat, peper en zout. Verwarm oven voor. Verdeel het spinaziemengsel in 7 gedeelten, omhul elk ei met het spinaziemengsel, leg dit op een plakje en dek af met nog een uitgerekt plakje. Druk de randen vast met een vork. Snij de randjes eraf om een echt rondje te krijgen. Plaats de bollen op bakpapier op een bakplaat, en bak in de oven op 200 graden in 30 minuten af. Snij de tomaten in kleine partjes. Snipper de ui zeer fijn en meng dit met de tomaten. Maak een dressing van 3 delen olie, 1 deel wijnazijn, 3 theelepels suiker, tijm en basilicum.",      ""    ]  },  {    "t": "Spitse bonen",    "p": 19,    "i": [      "|  1 1/5 | kg | Spitskool |   |",      "|  2 | st | Kidney Bonen |   |",      "|  2 | st | Knoflook |   |",      "|  2 | tl | Kerriepoeder |   |",      "|  1 | dl | Gembersiroop |   |",      "|  150 | g | Rozijnen |   |",      "|  100 | g | Boter |   |",      "|   |  | - Zout |   |",      "|   |  | - Peper |   |",      "|  1 | tl | Maizena | in 1 tl water  |"    ],    "s": [      "",      "",      "Spitskool in 4en, stronk verwijderen en in stukken snijden. Verhit boter in pan en bak de rozijnen hierin 1 min, afblussen met gembersiroop en water/maizena mengel.",      "",      "In ander pan knoflook met kerriepoeder fruiten, heel kort de spitskool erbij en dan de rozijnenmix erbij. Op hoog vuur blijven omscheppen om de kool te karamelliseren. Kidney bonen erbij en op laag vuur doorwarmen. Breng op smaak met zout en peper.",      "",      "Er blijft veel vocht over, probeer dat eens te binden met wat maizena...",      "",      ""    ]  },  {    "t": "Spruitjes met spek uit de wok",    "p": 20,    "i": [      "- Olie",      "- Zout",      "- Peper"    ],    "s": [      "",      "500 g Spruiten",      "500 g Wortels",      "250 g Spekreepjes",      "1500 g Aardappels",      "",      "Schil de aardappels, snij ze in kleine blokjes en doe ze in een kom met een beetje water. Maak ze in 15 minuten beetgaar in de magnetron. Bak ze in 18 min in de pan goudbruin. Maak de wortel schoon, en snij deze in kleine reepjes. Snipper de spruiten (eventueel in de keukenmachine). Bak de spekjes rustig in de pan met olie en peper en laat het geheel 7 minuten sudderen. Voeg de gesneden wortelen toe en laat het geheel in het vet koken, ongeveer 7 minuten, totdat de wortelen een beetje zacht geworden zijn. Uiteindelijk de reepjes spruit erbij voegen en het geheel nog 7 minuten op het vuur laten staan, steeds omscheppen.",      ""    ]  },  {    "t": "Sticky Suzan",    "p": 20,    "i": [      "- Seroendeng"    ],    "s": [      "",      "200 g Rijst",      "375 g Tofu",      "400 g Wokgroente Chinese, vers",      "1 st Courgette",      "2 st Knoflook",      "4 el Sweet Chili sauce",      "4 el Sojasaus",      "3 el Gembersiroop",      "2 el Azijn",      "2 el Water",      "1 el Maizena",      "",      "== Kook de rijst==",      "",      "Druk het vocht uit de tofu, en snij in blokjes",      "Bak tofu op middelhoog vuur in 10 minuten goudbruin en krokant",      "Snipper de courgette.",      "Breng de knoflook (stukjes), sojasaus, gembersiroop, rijstazijn, chilisaus, maizena en water in een steelpan aan de kook. Laat 3 min. zachtjes koken en roer met een houten lepel tot de saus begint te binden. Schep de gebakken tofu in de saus, wok daarna de groenten. Schep daarna de rijst bij de groenten.",      "Serveer de rijst, wok groenten, sticky tofu en seroendeng apart.",      ""    ]  },  {    "t": "Stoofperen",    "p": 20,    "i": [],    "s": [      "",      "1 kg Gieser Wilderman",      "1 tl Kaneel stokje",      "1 el Suiker",      "",      "Schil de peren, snij door de helft en haal het klokhuis eruit. Breng de peren met de kruiden en een scheut rode wijn aan de kook en laat vervolgens op het laagste vuur 4 uur stoven.",      ""    ]  },  {    "t": "Tempeh Bianca",    "p": 20,    "i": [      "- Olie"    ],    "s": [      "",      "200 g Tempeh",      "220 g Rijst",      "1 st Prei",      "600 g Sperziebonen",      "75 g Cashewnoten",      "1 el Ketjap Manis",      "2 el Sweet Chili sauce",      "1 el Citroen sap",      "",      "== Bak de cashew lichtbruin==",      "",      "Kook de sperziebonen 10 min.",      "",      "Kook de rijst.",      "",      "Snijd de tempeh in repen. Bak ze in ruim olie bruin en krokant in 4-5 min. Laat ze uitlekken op een bord met keukenpapier en bestrooi ze met een snuf zout. Stoof in dezelfde pan de prei in 5 min, en leg apart.",      "",      "Maak een saus van 2 el sweet chilisauce, 1 el ketjap manis en 1 el citroensap.",      "",      "Laat de saus even koken in de pan, voeg dan de reepjes toe en bedek ze met de saus.",      "",      "Voeg de gekookte boontjes, de prei toe en schep om.",      ""    ]  },  {    "t": "To-voetjes",    "p": 20,    "i": [      "- Olie"    ],    "s": [      "",      "350 g Tofu",      "1 st Spitskool",      "75 g Cashewnoten ongezouten",      "200 g Rijst zilvervlies",      "4 el Sojasaus",      "",      "Tofu goed uitlekken, op een schone keukenhanddoek droogdrukken.",      "",      "Tofu in blokjes snijden en marineren in sweet teriyaki saus:",      "Sweet teriyaki: 4 el soysauce, 1,5 el honing, 2 teen knoflook geperst, 1/2 tl djahe",      "(half tot 3 uur)",      "",      "Rijst koken.",      "",      "Halve cashewnoten in koekenpan 8 min roosteren.",      "",      "Spitskool in reepjes snijden.",      "",      "Tofu in hete olie in 3 minuten bruin bakken, daarna eruit halen.",      "",      "Spitskool in 5 minuten wokken, daarna tofu erbij en beetje doorwarmen.",      "",
